name: Owned AgentNet service

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/agentnet/**'
      - '.github/workflows/owned-agentnet.yml'
  push:
    branches: [main]
    paths:
      - 'services/agentnet/**'
      - '.github/workflows/owned-agentnet.yml'

permissions:
  contents: read

concurrency:
  group: owned-agentnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authentication:
    name: owned authentication · Linux persistence
    runs-on: ubuntu-24.04
    # Full service + eight protocol crates and cache upload can exceed 15 minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/agentnet
      - name: Validate owned authentication
        run: |
          cargo test --locked --manifest-path services/agentnet/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path services/agentnet/Cargo.toml -- -D warnings
          cargo fmt --manifest-path services/agentnet/Cargo.toml --check
          cargo build --locked --release --manifest-path services/agentnet/Cargo.toml --bin myagents-agentnet-service
      - name: Validate private deployment preparation
        run: |
          if ! command -v htpasswd >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y apache2-utils
          fi
          python3 -m unittest discover -s services/agentnet/deploy -p 'test_*.py'
      - name: Validate bounded device identity signer
        run: |
          cargo test --locked --manifest-path services/agentnet/identity-core/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path services/agentnet/identity-core/Cargo.toml -- -D warnings
          cargo fmt --manifest-path services/agentnet/identity-core/Cargo.toml --check
      - name: Validate finite Bot delegation and Rust/Node signature parity
        run: |
          cargo test --locked --manifest-path services/agentnet/execution-core/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path services/agentnet/execution-core/Cargo.toml -- -D warnings
          cargo fmt --manifest-path services/agentnet/execution-core/Cargo.toml --check
          node --test services/agentnet/execution-core/js/*.test.mjs
      - name: Validate durable device owner and proof of possession
        run: |
          cargo test --locked --manifest-path services/agentnet/device-core/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path services/agentnet/device-core/Cargo.toml -- -D warnings
          cargo fmt --manifest-path services/agentnet/device-core/Cargo.toml --check
      - name: Validate network admission, metadata ownership and bounded relay
        run: |
          for core in admission-core metadata-core peer-core relay-core; do
            cargo test --locked --manifest-path services/agentnet/$core/Cargo.toml
            cargo clippy --locked --all-targets --manifest-path services/agentnet/$core/Cargo.toml -- -D warnings
            cargo fmt --manifest-path services/agentnet/$core/Cargo.toml --check
          done
      - name: Record service artifact provenance
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p output/owned-agentnet
          cp services/agentnet/target/release/myagents-agentnet-service output/owned-agentnet/
          cd output/owned-agentnet
          sha256sum myagents-agentnet-service > SHA256SUMS
          cat SHA256SUMS
          printf '%s\n' "$SOURCE_COMMIT" > source-commit.txt
          ldd myagents-agentnet-service > native-dependencies.txt
      - uses: actions/upload-artifact@v4
        with:
          name: owned-agentnet-auth-linux
          path: output/owned-agentnet/
          if-no-files-found: error
