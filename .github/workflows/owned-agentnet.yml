name: Owned AgentNet service

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/agentnet/**'
      - '.github/workflows/owned-agentnet.yml'
  push:
    branches: [main]
    paths:
      - 'services/agentnet/**'
      - '.github/workflows/owned-agentnet.yml'

permissions:
  contents: read

concurrency:
  group: owned-agentnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authentication:
    name: owned authentication · Linux persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/agentnet
      - name: Validate owned authentication
        run: |
          cargo test --locked --manifest-path services/agentnet/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path services/agentnet/Cargo.toml -- -D warnings
          cargo fmt --manifest-path services/agentnet/Cargo.toml --check
      - name: Validate private deployment preparation
        run: |
          if ! command -v htpasswd >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y apache2-utils
          fi
          python3 -m unittest discover -s services/agentnet/deploy -p 'test_*.py'
