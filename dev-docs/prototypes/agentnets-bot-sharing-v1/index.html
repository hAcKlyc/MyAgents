function botsPage(){let q=s.filter.q.toLowerCase(),rows=s.bots.filter(b=>b.managed&&!b.deletedAt&&(!q||b.name.toLowerCase().includes(q)||b.owner.toLowerCase().includes(q))&&(!s.filter.status||b.state===s.filter.status)&&(!s.filter.host||b.hostNode===s.filter.host));let allManaged=s.bots.filter(b=>b.managed),managed=allManaged.filter(b=>!b.deletedAt),shared=managed.filter(b=>b.shared&&!b.paused).length,used=allManaged.reduce((n,b)=>n+b.usage,0);return `${heading('Bots 管理控制台','管理当前服务实例内已纳管 Bot 的共享关系和权限边界。所有数值为合成演示数据。',button('＋ 新建 Bot','new-bot-page','btn primary'))}<div class="bots-layout ${s.detailFocus?'detail-focus':''}"><div class="directory-stack"><div class="stats"><div class="stat"><strong>${s.bots.filter(b=>b.managed&&!b.deletedAt).length}</strong><small>纳管 Bots</small></div><div class="stat"><strong>${new Set(s.bots.filter(b=>b.managed&&!b.deletedAt).map(b=>b.owner)).size}</strong><small>Bot 所有者</small></div><div class="stat"><strong>${shared}</strong><small>共享启用中</small></div><div class="stat"><strong>${(used/1000).toFixed(0)}k</strong><small>累计模拟用量（含回收站）· Token</small></div></div><section class="card"><div class="cardhead"><div><h2>Bot 目录</h2><p>跨所有者、跨 Host 的纳管 Bot 清单</p></div><span class="muted">${rows.length} 个结果</span></div><div class="filters"><input id="search" value="${esc(s.filter.q)}" placeholder="搜索 Bot 名称或所有者" aria-label="搜索 Bot 名称或所有者"><select id="filter-status" aria-label="按状态筛选"><option value="">全部状态</option>${['运行中','已停止','待配置','异常'].map(x=>`<option ${s.filter.status===x?'selected':''}>${x}</option>`).join('')}</select><select id="filter-host" aria-label="按 Host 筛选"><option value="">全部 Host</option>${[...new Set(s.bots.filter(b=>b.managed&&!b.deletedAt).map(b=>b.hostNode))].map(x=>`<option value="${x}" ${s.filter.host===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="table-scroll"><table class="table"><thead><tr><th>Bot</th><th>所有者</th><th>运行 Host</th><th>运行状态</th><th>共享状态</th><th>成员</th><th>模拟用量</th><th></th></tr></thead><tbody>${rows.map(b=>`<tr><td><button type="button" class="botlink" data-open-bot="${b.id}">${esc(b.name)}</button><span class="sub">${b.managed?'当前实例 · 已纳管':'未纳管'}</span></td><td>${esc(b.owner)}</td><td>${esc(b.host)}<span class="sub">Host ${pill(b.hostState,b.hostState==='在线'?'ok':'bad')}</span></td><td>${pill(lifecycleLabel(b),lifecycleTone(b))}<span class="sub">${esc(lifecycleDetail(b))}</span></td><td>${pill(resState(b),b.paused?'warn':b.shared?'blue':'')}</td><td>${b.grants.filter(g=>g.status==='active').length}</td><td>${(b.usage/1000).toFixed(0)}k / ${(b.dailyCap/1000).toFixed(0)}k</td><td>${button('详情','open-bot','btn small',`data-id="${b.id}"`)}</td></tr>`).join('')||`<tr><td colspan="8"><div class="empty">没有匹配的 Bot。调整搜索词或筛选条件。</div></td></tr>`}</tbody></table></div></section><div class="lower"><section class="card"><div class="cardhead"><div><h2>共享关系概览</h2><p>显示授权元数据，不显示会话正文</p></div></div><div class="pad"><div class="summary"><div>活跃成员</div><div>${s.bots.filter(b=>b.managed&&!b.deletedAt).reduce((n,b)=>n+b.grants.filter(g=>g.status==='active').length,0)} 个授权关系</div><div>待审批任务</div><div>${s.bots.filter(b=>b.managed&&!b.deletedAt).reduce((n,b)=>n+b.pending.filter(a=>a.status==='pending').length,0)} 个 · 已预留额度</div><div>共享暂停 Bot</div><div>${s.bots.filter(b=>b.paused).length} 个</div></div></div></section><section class="card"><div class="cardhead"><div><h2>管理边界</h2><p>平台管理权限与 Bot/Host 所有权分离</p></div></div><div class="pad"><div class="callout">平台管理员仅管理纳管 Bot 与所有者声明的可共享资源上限。私人会话、原始凭据与 Host OS 不可访问；暂停共享不会停止 Host 进程。</div></div></section></div> </div>${s.selected?`<div class="detail-column">${detailPanel(selected())}</div>`:''}</div>`}
function hostPolicy(hid,uid,runtime){let h=HOSTS[hid];if(!h)return '请选择纳管 Host。';if(h.state!=='在线')return `${hid} 离线，不能部署或转移到该 Host。`;if(!h.users.includes(uid))return `${USER[uid]?.name||'该用户'}没有此 Host 的部署授权。`;if(runtime&&!h.runtimes.includes(runtime))return `${hid} 不兼容 ${runtime} Runtime。`;return ''}
function ownerResourceTemplate(uid){return (OWNER_RESOURCES[uid]||[]).map(name=>({name,shareable:true,description:'所属用户的默认共享资料模板'}))}
function updateNewSummary(){let f=document.getElementById('new-bot-form');if(!f)return;let uid=f.querySelector('#new-owner').value,hid=f.querySelector('#new-host').value,rt=f.querySelector('#new-runtime').value,msg=hostPolicy(hid,uid,rt),h=HOSTS[hid];document.getElementById('new-summary').innerHTML=`${esc(USER[uid]?.name||'请选择所属用户')} · ${esc(h?.label||'请选择 Host')} · ${esc(rt)} · 创建后：已停止 · 共享关闭${msg?`<br><strong class="text-red">${esc(msg)}</strong>`:''}`;[...f.querySelector('#new-host').options].forEach(o=>{let reason=hostPolicy(o.value,uid,rt);o.disabled=!!reason&&o.value!==hid});f.querySelector('#new-save').disabled=!!msg}
function newBotPage(){return `${heading('新建 Bot','创建当前实例纳管 Bot。只保存本地合成配置；不会连接 Host 或启动进程。',button('返回目录','cancel-new-bot','btn'))}<section class="card lifecycle-form"><div class="cardhead"><div><h2>基础信息与执行配置</h2><p>新建 Bot 默认停止、共享关闭。模型引用为合成配置名，不包含凭据。</p></div></div><div class="pad"><form id="new-bot-form" novalidate><div class="formgrid"><div class="field"><label for="new-name">Bot 名称 <span aria-hidden="true">*</span></label><input id="new-name" maxlength="60" required placeholder="1–60 个字符"></div><div class="field"><label for="new-owner">所属用户 <span aria-hidden="true">*</span></label><select id="new-owner">${['zhou','lin','chen','xu'].map(id=>`<option value="${id}">${esc(USER[id].name)}</option>`).join('')}</select></div><div class="field full"><label for="new-description">用途说明</label><input id="new-description" maxlength="180" placeholder="简述这个 Bot 的用途"></div><div class="field"><label for="new-host">纳管 Host <span aria-hidden="true">*</span></label><select id="new-host">${Object.entries(HOSTS).map(([id,h])=>`<option value="${id}">${esc(h.label)} · ${h.state==='在线'?'在线':'离线，不可部署'}</option>`).join('')}</select></div><div class="field"><label for="new-runtime">Runtime <span aria-hidden="true">*</span></label><select id="new-runtime"><option>Builtin</option><option>Codex</option></select></div><div class="field"><label for="new-model">模型配置引用 <span aria-hidden="true">*</span></label><select id="new-model"><option value="">选择模拟配置</option><option value="model-balanced-sim">MoxBots Balanced · 模拟配置 A</option><option value="model-reasoning-sim">MoxBots Reasoning · 模拟配置 B</option></select><small class="muted">仅名称引用，不显示或保存供应商凭据。</small></div><div class="field"><label for="new-budget">Bot 日总额度 · Token <span aria-hidden="true">*</span></label><input id="new-budget" type="number" min="1000" max="1000000" step="1000" value="100000"></div><div class="field full"><label for="new-prompt">系统指令</label><textarea id="new-prompt" maxlength="2000" placeholder="填写 Bot 的执行边界与任务说明"></textarea></div><div class="field full"><div class="summary"><div>创建状态</div><div>已停止 · 共享关闭</div><div>所有权/Host 授权</div><div id="new-summary"></div></div><div class="callout" style="margin-top:12px">Host 分配需满足所属用户部署授权及 Runtime 兼容。保存不会启动 Bot，也不会启用共享。</div><div id="new-error"></div></div></div><div class="head-actions" style="justify-content:flex-end;margin-top:16px">${button('取消','cancel-new-bot','btn')}<button type="submit" class="btn primary" id="new-save">创建并查看详情</button></div></form></div></section>`}
function createBot(){let f=document.getElementById('new-bot-form');if(!f)return;let name=f.querySelector('#new-name').value.trim(),ownerId=f.querySelector('#new-owner').value,hostNode=f.querySelector('#new-host').value,runtime=f.querySelector('#new-runtime').value,modelRef=f.querySelector('#new-model').value,budget=Number(f.querySelector('#new-budget').value),error=[];if(!name||name.length>60)error.push('名称必填，长度为 1–60 个字符。');if(s.bots.some(b=>b.managed&&!b.deletedAt&&b.name.trim().toLowerCase()===name.toLowerCase()))error.push('当前实例已有同名 Bot，请使用其他名称。');if(!['zhou','lin','chen','xu'].includes(ownerId))error.push('请选择有效所属用户。');if(hostPolicy(hostNode,ownerId,runtime))error.push(hostPolicy(hostNode,ownerId,runtime));if(!modelRef)error.push('请选择一个模拟模型配置引用。');if(!Number.isInteger(budget)||budget<1000||budget>1000000)error.push('日总额度必须为 1,000–1,000,000 Token 的整数。');if(error.length){document.getElementById('new-error').innerHTML=`<div class="callout error">${error.map(esc).join('<br>')}</div>`;return}let id=`bot-${++s.botSeq}`,resources=ownerResourceTemplate(ownerId),h=HOSTS[hostNode],b={id,name,description:f.querySelector('#new-description').value.trim()||`${name} 的用途说明`,owner:USER[ownerId].name,ownerId,hostNode,host:h.label,hostState:h.state,state:'已停止',lifecycle:'stopped',lifecycleVersion:1,configured:!!f.querySelector('#new-prompt').value.trim(),runtime,modelRef,systemPrompt:f.querySelector('#new-prompt').value.trim(),configVersion:1,managed:true,shared:false,paused:false,cap:{resources:resources.map(x=>x.name),canEdit:false,canAdmin:false,dailyMax:budget,thresholdMin:5000},resources,usage:0,dailyCap:budget,grants:[],pending:[],audit:[],sessions:[],admission:false,deletedAt:null};s.bots.unshift(b);addAudit(b,'创建 Bot','平台管理员',`${b.owner} · ${b.hostNode} · ${runtime} · 已停止 · 共享关闭`);s.selected=id;s.detailTab='overview';s.page='bots';s.detailFocus=window.innerWidth<=1040;save();shell();toast('Bot 已创建并保持停止状态；共享未启用')}
function detailPanel(b){return `<section class="card" id="bot-detail"><div class="cardhead"><div><h2>${esc(b.name)}</h2><p>${esc(b.owner)} 所有 · ${esc(b.host)} · 共享上限由所有者声明</p></div><div class="cell-actions">${button(b.paused?'恢复共享':'暂停共享','toggle-pause',`btn ${b.paused?'':'danger'}`,`data-id="${b.id}"`)}${button('返回目录','back-directory','btn small')}</div></div><div class="lifecycle-actions">${button('配置','configure-bot','btn small',`data-id="${b.id}"`)}${button('分配用户与 Host','assign-bot','btn small',`data-id="${b.id}"`)}${b.lifecycle==='running'?button('停止 Bot','stop-bot','btn small danger',`data-id="${b.id}"`):b.lifecycle==='stop-unknown'?button('停止待确认','stop-bot','btn small',`data-id="${b.id}" disabled title="Host 在线并由执行端确认后才能继续"`):button('启动 Bot','start-bot','btn small primary',`data-id="${b.id}"`)}${button('删除 Bot','delete-bot','btn small danger',`data-id="${b.id}"`)}</div><div class="lifecycle-status">${pill(lifecycleLabel(b),lifecycleTone(b))} ${b.lifecycle==='stop-unknown'?'<span class="muted">Host 离线，运行状态未知；请等待 Host 侧确认停止。</span>':b.hostState!=='在线'&&b.lifecycle==='running'?'<span class="muted">Host 离线，实际运行状态未知。</span>':''}</div><div class="tabs">${[['overview','概览'],['members','共享成员'],['resources','资源与权限'],['usage','额度与审计']].map(([id,n])=>`<button type="button" data-detail-tab="${id}" class="${s.detailTab===id?'on':''}">${n}</button>`).join('')}</div><div class="pad" style="padding-top:15px">${s.detailTab==='overview'?overview(b):s.detailTab==='members'?members(b):s.detailTab==='resources'?resourcePanel(b):usagePanel(b)}</div></section>`}
function overview(b){return `<div class="detail-grid"><div class="detail-stack"><div class="summary"><div>Bot 状态</div><div>${pill(lifecycleLabel(b),lifecycleTone(b))}<span class="sub">${esc(lifecycleDetail(b))}</span></div><div>共享状态</div><div>${pill(resState(b),b.paused?'warn':b.shared?'blue':'')}</div><div>活跃成员</div><div>${b.grants.filter(g=>g.status==='active').length}</div><div>模拟 Token 用量</div><div>${(b.usage/1000).toFixed(0)}k / ${(b.dailyCap/1000).toFixed(0)}k 日上限</div><div>Host 连通性</div><div>${pill(b.hostState,b.hostState==='在线'?'ok':'bad')}</div><div>执行配置</div><div>${b.configured?'v'+b.configVersion+' · '+esc(b.runtime)+' · '+esc(b.modelRef||'无模型引用'):'待配置'}</div></div></div><div class="callout">此为平台治理视图。可见共享关系与用量元数据；不读取任何使用者会话正文、私人记忆或凭据。${b.hostState==='离线'?'<br><br>Host 离线：拒绝新的模拟任务。请由 Host 所有者恢复连接；平台管理员没有 OS 管理权。':''}${!b.cap.resources.length?'<br><br>所有者尚未声明可共享资源上限。':''}</div></div>`}
function members(b){return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div><strong>共享成员与授权</strong><div class="muted">权限按 Bot 隔离；修改授权会递增版本并使旧审批失效。</div></div>${button('＋ 邀请用户','invite','btn primary small',`data-id="${b.id}"`)}</div>${b.paused?'<div class="callout warn" style="margin-bottom:12px">Bot 共享已暂停。现有成员授权保留，新任务不可发起；恢复后按当前授权版本重新校验。</div>':''}<div class="table-scroll"><table class="table" style="min-width:700px"><thead><tr><th>用户</th><th>角色</th><th>授权资料</th><th>日额度 / 已用</th><th>有效期</th><th>状态</th><th>操作</th></tr></thead><tbody>${b.grants.map(g=>`<tr><td><div class="person"><span class="avatar">${USER[g.user]?.initial||'?'}</span><span>${esc(USER[g.user]?.name||'未知用户')}<span class="sub">${esc(USER[g.user]?.mail||'')}</span></span></div></td><td>${esc(g.role)}${g.canAdmin?'<span class="sub">仅低级成员委派</span>':''}</td><td>${g.resources.map(x=>`<span class="pill">${esc(x)}</span>`).join(' ')||'—'}${g.canEdit?'<span class="sub">可维护授权资料</span>':''}</td><td>${(g.used/1000).toFixed(0)}k / ${(g.daily/1000).toFixed(0)}k</td><td>${esc(g.expires)}</td><td>${pill(g.status==='active'?(expired(g.expires)?'已到期':'有效'):g.status==='pending'?(expired(g.expires)?'邀请已过期':'待接受'):g.status==='expired'?'已过期':g.status==='declined'?'已拒绝':'已撤销',g.status==='active'&&!expired(g.expires)?'ok':g.status==='pending'&&!expired(g.expires)?'warn':'bad')}</td><td><div class="cell-actions">${g.status==='active'?button(expired(g.expires)?'续期 / 权限':'权限','edit-grant','btn small',`data-id="${b.id}" data-grant="${g.id}"`)+button('撤销','revoke','btn small danger',`data-id="${b.id}" data-grant="${g.id}"`):''}</div></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">此 Bot 尚无共享成员。邀请会绑定指定的已注册账号。</div></td></tr>'}</tbody></table></div><div class="callout" style="margin-top:13px">所有者保持不变。Bot 共享管理员仅能管理该 Bot 中被委派的低级成员，不能跨 Bot、改总预算或查看会话正文。</div>`}
function resourcePanel(b){return `<div class="detail-grid"><div class="detail-stack"><strong>所有者声明的可共享上限</strong>${b.resources.map(r=>`<label class="check ${r.shareable?'':'locked'}"><input type="checkbox" disabled ${r.shareable?'':'disabled'} ${b.cap.resources.includes(r.name)?'checked':''}><span><strong>${esc(r.name)} ${r.shareable?pill('允许进入授权范围','ok'):pill('禁止分享','bad')}</strong><small>${esc(r.description)}${!r.shareable?' · 平台管理员不能覆盖此限制':''}</small></span></label>`).join('')}</div><div class="detail-stack"><div class="summary"><div>角色可维护资料</div><div>${b.cap.canEdit?'所有者上限允许，需在单个 grant 明确授权':'所有者声明禁止'}</div><div>管理员委派</div><div>${b.cap.canAdmin?'可由所有者限域委派':'所有者未开放委派'}</div><div>单用户日额度上限</div><div>${(b.cap.dailyMax/1000).toFixed(0)}k Token</div><div>最低审批阈值</div><div>${(b.cap.thresholdMin/1000).toFixed(0)}k Token</div></div><div class="callout warn">灰色或禁止分享的资源不能被管理员添加。平台管理员不能取得超出 Bot 声明范围的权限。</div></div></div>`}
function usagePanel(b){return `<div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><strong>${(b.usage/1000).toFixed(0)}k</strong><small>Bot 累计模拟用量 Token</small></div><div class="stat"><strong>${(b.dailyCap/1000).toFixed(0)}k</strong><small>Bot 模拟日额度</small></div><div class="stat"><strong>${b.pending.filter(a=>a.status==='pending').length}</strong><small>待审批并预留额度</small></div></div><div class="logrow"><strong>用量说明</strong><div class="muted">仅为合成演示值，不连接模型供应商、不产生费用。审计只包含调用者、Bot、授权版本、操作和用量元数据。</div></div>${auditRows(b.audit)}</div>`}

function botDetail(){let b=selected();if(!b)return '';return `<div style="margin-top:16px">${detailPanel(b)}</div>`}
function hostsPage(){let live=s.bots.filter(b=>b.managed&&!b.deletedAt),hs=Object.entries(HOSTS).map(([name,h])=>({name,type:h.label.split(' · ')[0],state:h.state,bots:live.filter(b=>b.hostNode===name).length}));return `${heading('Hosts','仅展示纳管 Bot 关联的 Host 元数据；平台管理员不获得 Host OS、凭据或设备管理权限。')}<div class="tilegrid">${hs.map(h=>`<article class="tile"><h3>${esc(h.name)}</h3><p class="muted">Host 节点 ${esc(h.name)} · 关联 ${h.bots} 个纳管 Bot · 状态为合成数据</p>${pill(h.state,h.state==='在线'?'ok':'bad')}<p class="muted">允许 Runtime：${HOSTS[h.name].runtimes.join('、')} · 仅限授权用户</p><div style="margin-top:12px">${button('查看关联 Bots','filter-host','btn small',`data-host="${esc(h.name)}"`)} ${button('OS 管理','disabled-host','btn small',`disabled title="平台管理员无 Host OS 权限"`)}</div></article>`).join('')}</div>`}

function usersPage(){let live=s.bots.filter(b=>b.managed&&!b.deletedAt),all=new Set(live.flatMap(b=>[b.ownerId,...b.grants.map(g=>g.user)]));return `${heading('用户与权限','只展示当前纳管 Bots 的所属关系与共享授权；不枚举其他私人对象。')}<section class="card"><div class="table-scroll"><table class="table"><thead><tr><th>注册用户</th><th>所属 Bots</th><th>共享 Bots / 角色</th><th>模拟用量</th><th>权限边界</th></tr></thead><tbody>${Object.entries(USER).filter(([id])=>all.has(id)).map(([id,u])=>{let owned=live.filter(b=>b.ownerId===id),gs=live.flatMap(b=>b.grants.filter(g=>g.user===id&&g.status==='active').map(g=>({g,b})));return `<tr><td><div class="person"><span class="avatar">${u.initial}</span><span>${esc(u.name)}<span class="sub">${esc(u.mail)}</span></span></div></td><td>${owned.map(x=>esc(x.name)).join('、')||'—'}</td><td>${gs.map(x=>`${esc(x.b.name)} · ${esc(x.g.role)}`).join('<br>')||'—'}</td><td>${gs.reduce((n,x)=>n+x.g.used,0)/1000}k Token</td><td>只可访问逐项授权的 Bot 与资源</td></tr>`}).join('')}</tbody></table></div></section>`}

function approvalsPage(){let rows=s.bots.filter(b=>b.managed&&!b.deletedAt).flatMap(b=>b.pending.filter(a=>a.status==='pending').map(a=>({b,a})));return `${heading('操作审批','每项审批绑定 Bot、调用者、资源、费用归属和授权版本；提交时已预留额度。')}<section class="card">${rows.length?rows.map(({b,a})=>`<div class="pad" style="padding-top:15px;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:12px"><strong>${esc(a.title)}</strong>${pill('待审批 · 已预留','warn')}</div><div class="summary" style="margin-top:10px"><div>调用者</div><div>${esc(USER[a.user]?.name||'用户')}</div><div>Bot / 所有者</div><div>${esc(b.name)} · ${esc(b.owner)}</div><div>授权资源</div><div>${a.resources.map(esc).join('、')}</div><div>执行身份 / 费用</div><div>共享 Bot 模拟身份 · 费用由 Bot 所有者承担</div><div>预计用量</div><div>${a.tokens/1000}k Token · 合成估算</div><div>授权版本</div><div>v${a.version}</div></div><div style="display:flex;gap:8px;margin-top:12px">${button('批准并模拟执行','approve','btn primary small',`data-id="${b.id}" data-approval="${a.id}"`)}${button('拒绝','deny','btn danger small',`data-id="${b.id}" data-approval="${a.id}"`)}</div></div>`).join(''):'<div class="empty">当前没有待处理审批。</div>'}</section>`}
function auditPage(){let allManaged=s.bots.filter(b=>b.managed);return `${heading('用量与审计','全局视图仅显示合成用量与操作元数据，不记录私人会话正文。')}<div class="stats"><div class="stat"><strong>${allManaged.reduce((n,b)=>n+b.usage,0)/1000}k</strong><small>累计模拟 Token（含回收站）</small></div><div class="stat"><strong>${allManaged.reduce((n,b)=>n+b.grants.reduce((m,g)=>m+g.used,0),0)/1000}k</strong><small>共享用户模拟用量（含回收站）</small></div><div class="stat"><strong>${s.audit.length}</strong><small>审计事件</small></div><div class="stat"><strong>模拟</strong><small>计量来源</small></div></div><section class="card"><div class="cardhead"><h2>平台操作审计</h2></div><div class="pad">${auditRows(s.audit)}</div></section>`}
function lifecycleLabel(b){if(b.deletedAt||b.lifecycle==='deleted')return '已删除';if(b.lifecycle==='stop-unknown')return '停止待确认 · 运行状态未知';if(b.lifecycle==='running'&&b.hostState!=='在线')return '运行状态未知';if(b.lifecycle==='running')return '运行中';if(b.lifecycle==='stopped')return '已停止';return '待配置'}
function lifecycleTone(b){return b.deletedAt||b.lifecycle==='stop-unknown'||(b.lifecycle==='running'&&b.hostState!=='在线')?'warn':b.lifecycle==='running'?'ok':'blue'}
function lifecycleDetail(b){if(b.lifecycle==='stop-unknown'||(b.lifecycle==='running'&&b.hostState!=='在线'))return `Host ${b.hostNode} 离线 · 状态待确认`;if(b.lifecycle==='running')return `配置 v${b.configVersion} · ${b.hostNode}${b.paused?' · 共享已暂停':b.shared?' · 共享启用':' · 共享关闭'}`;if(!b.configured)return `执行配置待补全 · 启动前填写系统指令 · ${b.hostNode}`;return `${b.hostNode} · ${b.shared?(b.paused?'共享已暂停':'共享关系保留'):'共享关闭'}`;}
function trashPage(){let rows=s.bots.filter(b=>b.managed&&b.deletedAt);return `${heading('回收站','逻辑删除的纳管 Bots。恢复后 Bot 处于停止状态且共享关闭；成员授权不会自动恢复。')}<section class="card"><div class="cardhead"><div><h2>已删除 Bots</h2><p>历史审计与使用者本人已有成果保留，不提供永久清除。</p></div><span class="muted">${rows.length} 个对象</span></div><div class="pad deleted-list">${rows.map(b=>`<article class="deleted-card"><div><strong>${esc(b.name)}</strong><div class="muted">${esc(b.owner)} · ${esc(b.host)} · 删除于 ${esc(b.deletedAt)}</div></div>${button('恢复为已停止','restore-bot','btn small primary',`data-id="${b.id}"`)}</article>`).join('')||'<div class="empty">回收站为空。</div>'}</div></section>`}
function content(){if(s.page==='new-bot')return newBotPage();if(s.page==='trash')return trashPage();if(s.page==='bots')return botsPage();if(s.page==='hosts')return hostsPage();if(s.page==='users')return usersPage();if(s.page==='approvals')return approvalsPage();return auditPage()}
function openDialog(title,body,foot){focusBack=document.activeElement;document.getElementById('modal').innerHTML=`<div class="modalback" data-backdrop><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title"><div class="dialoghead"><h2 id="dlg-title">${title}</h2><button type="button" class="close" data-a="close-dialog" aria-label="关闭">×</button></div><div class="dialogbody">${body}</div><div class="dialogfoot">${foot}</div></section></div>`;let d=document.querySelector('.dialog');d.addEventListener('keydown',e=>{if(e.key==='Tab'){let all=[...d.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled)')];if(all.length&&e.shiftKey&&document.activeElement===all[0]){e.preventDefault();all.at(-1).focus()}else if(all.length&&!e.shiftKey&&document.activeElement===all.at(-1)){e.preventDefault();all[0].focus()}}});d.querySelector('input:not(:disabled),select:not(:disabled),button:not(:disabled)')?.focus()}
function closeDialog(){document.getElementById('modal').innerHTML='';focusBack?.focus?.()}
function invitation(b){if(!b.managed||b.deletedAt){toast('此 Bot 不在平台管理员纳管范围内或已删除');return}if(b.lifecycle!=='running'){toast('Bot 当前未运行，启动后才能创建共享邀请。');return}if(!b.cap.resources.length){toast('所有者尚未声明可共享资源上限，无法创建授权');return}openDialog(`邀请用户 · ${esc(b.name)}`,`<form id="invite-form" data-bot="${b.id}"><div class="formgrid"><div class="field full"><label for="invite-user">指定用户</label><select id="invite-user"><option value="">选择已注册用户</option>${Object.entries(USER).filter(([id])=>id!=='guest').map(([id,u])=>`<option value="${id}">${esc(u.name)} · ${esc(u.mail)}</option>`).join('')}</select></div><div class="field"><label for="invite-role">共享角色</label><select id="invite-role"><option>使用者</option><option>协作者</option><option>共享管理员</option></select></div><div class="field"><label for="invite-expires">有效期</label><select id="invite-expires"><option value="2026-12-31">至 2026-12-31</option><option value="2026-11-12">30 天</option><option value="2026-10-20">7 天</option><option value="2026-10-12">演示已过期 · 2026-10-12</option></select></div><div class="field"><label for="invite-daily">成员日额度 · Token</label><input id="invite-daily" type="number" min="1000" max="${b.cap.dailyMax}" step="1000" value="${Math.min(50000,b.cap.dailyMax)}"></div><div class="field"><label for="invite-threshold">单次审批阈值 · Token</label><input id="invite-threshold" type="number" min="${b.cap.thresholdMin}" step="1000" value="20000"></div><div class="field full"><label>授权资料范围（仅所有者声明可共享上限）</label>${b.resources.map(r=>`<label class="check ${r.shareable&&b.cap.resources.includes(r.name)?'':'locked'}"><input type="checkbox" value="${esc(r.name)}" ${r.shareable&&b.cap.resources.includes(r.name)?'':'disabled'}><span><strong>${esc(r.name)} ${r.shareable&&b.cap.resources.includes(r.name)?'':pill('不可分享','bad')}</strong><small>${esc(r.description)}${!r.shareable?' · 私人/敏感资源不可由平台管理员开放':''}</small></span></label>`).join('')}</div><div class="field full" id="invite-role-capability"></div><div class="field full"><div id="invite-error"></div><div class="callout" id="invite-summary">请选择用户与授权资料。该授权独立于所有者、调用者和费用承担人。</div></div></div></form>`,`${button('取消','close-dialog','btn')}${button('创建待接受邀请','create-invite','btn primary')}`);document.querySelectorAll('#invite-form input,#invite-form select').forEach(x=>x.addEventListener('change',()=>updateInviteSummary(b)));updateInviteSummary(b)}
function updateInviteSummary(b){let f=document.getElementById('invite-form');if(!f)return;let user=f.querySelector('#invite-user').value,role=f.querySelector('#invite-role').value,resources=[...f.querySelectorAll('input[type=checkbox][value]:checked')].map(x=>x.value),daily=Number(f.querySelector('#invite-daily').value),threshold=Number(f.querySelector('#invite-threshold').value),box=document.getElementById('invite-role-capability'),wasEdit=!!f.querySelector('#invite-edit')?.checked,wasAdmin=!!f.querySelector('#invite-admin')?.checked;box.innerHTML=role==='协作者'&&b.cap.canEdit?'<label class="check"><input id="invite-edit" type="checkbox"><span><strong>允许维护所选资料</strong><small>只在明确选定范围内，默认关闭</small></span></label>':role==='共享管理员'&&b.cap.canAdmin?'<label class="check"><input id="invite-admin" type="checkbox"><span><strong>委派低级成员管理</strong><small>限于此 Bot，不含总预算和 Host 管理</small></span></label>':'';if(f.querySelector('#invite-edit'))f.querySelector('#invite-edit').checked=wasEdit;if(f.querySelector('#invite-admin'))f.querySelector('#invite-admin').checked=wasAdmin;box.onchange=()=>updateInviteSummary(b);let edit=!!f.querySelector('#invite-edit')?.checked,admin=!!f.querySelector('#invite-admin')?.checked;document.getElementById('invite-summary').innerHTML=`目标：${user?esc(USER[user].name):'尚未选择'} · 角色：${esc(role)}<br>可读资料：${resources.length?resources.map(esc).join('、'):'尚未选择'}<br>资料维护：${edit?'仅所选资料':'关闭'} · 低级成员管理：${admin?'限本 Bot':'关闭'}<br>对外发送、Host OS：关闭<br>日额度：${Number.isFinite(daily)?daily.toLocaleString():'—'} / ${b.cap.dailyMax.toLocaleString()} Token · 审批阈值：${Number.isFinite(threshold)?threshold.toLocaleString():'—'} Token<br>会话与记忆独立 · 费用归属 Bot 所有者（模拟）`}

function editGrant(b,g){if(!b.managed||g.status!=='active'){toast('该授权当前不可编辑');return}openDialog(`编辑授权 · ${esc(USER[g.user]?.name||'成员')}`,`<form id="grant-form" data-bot="${b.id}" data-grant="${g.id}"><div class="formgrid"><div class="field"><label for="grant-role">角色</label><select id="grant-role">${['使用者','协作者','共享管理员'].map(x=>`<option ${g.role===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="grant-exp">有效期</label><select id="grant-exp"><option ${g.expires==='2026-12-31'?'selected':''}>2026-12-31</option><option ${g.expires==='2026-11-12'?'selected':''}>2026-11-12</option><option ${g.expires==='2026-10-20'?'selected':''}>2026-10-20</option><option ${g.expires==='2026-10-12'?'selected':''}>2026-10-12</option></select></div><div class="field"><label for="grant-daily">日额度 · Token</label><input id="grant-daily" type="number" min="${g.used}" max="${b.cap.dailyMax}" step="1000" value="${g.daily}"></div><div class="field"><label for="grant-threshold">单次审批阈值 · Token</label><input id="grant-threshold" type="number" min="${b.cap.thresholdMin}" step="1000" value="${g.threshold}"></div><div class="field full"><label>资源范围</label>${b.resources.map(r=>`<label class="check ${r.shareable&&b.cap.resources.includes(r.name)?'':'locked'}"><input type="checkbox" value="${esc(r.name)}" ${g.resources.includes(r.name)?'checked':''} ${r.shareable&&b.cap.resources.includes(r.name)?'':'disabled'}><span><strong>${esc(r.name)} ${!r.shareable?'不可分享':''}</strong><small>${esc(r.description)}</small></span></label>`).join('')}</div><div class="field full"><label class="check"><input id="grant-editable" type="checkbox" ${g.canEdit?'checked':''} ${b.cap.canEdit&&g.role==='协作者'?'':'disabled'}><span><strong>维护授权资料</strong><small>仅限上方选定资源；所有者上限${b.cap.canEdit?'允许':'禁止'}</small></span></label><label class="check"><input id="grant-admin" type="checkbox" ${g.canAdmin?'checked':''} ${b.cap.canAdmin&&g.role==='共享管理员'?'':'disabled'}><span><strong>管理低级成员</strong><small>不能跨 Bot、不能改总预算或管理 Host</small></span></label></div><div class="field full"><div id="grant-error"></div></div></div></form>`,`${button('取消','close-dialog','btn')}${button('保存授权','save-grant','btn primary')}`)}
function userView(){let id=s.usersim.user,available=s.bots.map(b=>({b,g:grant(b,id)})).filter(x=>x.g||x.b.grants.some(g=>g.user===id&&['pending','expired'].includes(g.status))||x.b.grants.some(g=>g.user===id&&g.status==='active'&&expired(g.expires))||x.b.sessions?.some(r=>r.user===id));return `<div class="usersim" role="dialog" aria-modal="true" aria-labelledby="usersim-title" tabindex="-1"><header class="usersimtop"><div><strong id="usersim-title">Bots Net 用户端模拟</strong> ${pill('模拟身份 · '+USER[id].name,'blue')}<div class="muted">与真实认证/服务端隔离；仅模拟此演示中的授权结果。</div></div><div class="cell-actions"><select id="sim-user" aria-label="选择体验用户">${Object.entries(USER).map(([uid,u])=>`<option value="${uid}" ${uid===id?'selected':''}>${esc(u.name)}</option>`).join('')}</select>${button('返回管理员控制台','close-user','btn')}</div></header><main class="usersimcontent">${s.usersim.bot?userBotPage(s.usersim.bot,id):`${heading('共享给我','只显示此模拟账号已接受的 Bot 与绑定账号的待接受邀请。')}<h2 style="font-size:16px">待接受邀请</h2>${s.bots.flatMap(b=>b.grants.filter(g=>g.user===id&&g.status==='pending').map(g=>`<article class="tile"><h3>${esc(b.name)}</h3><p class="muted">邀请自 ${esc(b.owner)} · ${esc(g.role)} · 目标账号 ${esc(USER[id].mail)}</p>${expired(g.expires)?`<div class="callout warn">邀请已于 ${esc(g.expires)} 到期，无法接受。请平台管理员重新邀请或调整有效期。</div>`:`<p>资源：${g.resources.map(esc).join('、')} · 日额度 ${(g.daily/1000).toFixed(0)}k · 费用归属 Bot 所有者</p>${button('接受邀请','accept-user-invite','btn primary small',`data-id="${b.id}" data-grant="${g.id}"`)} ${button('拒绝','decline-user-invite','btn small',`data-id="${b.id}" data-grant="${g.id}"`)}`}</article>`)).join('')||''}<h2 style="font-size:16px;margin-top:20px">可使用的 Bots</h2><div class="tilegrid">${available.filter(x=>x.g?.status==='active'||x.b.grants.some(z=>z.user===id&&z.status==='active'&&expired(z.expires))||x.b.grants.some(z=>z.user===id&&z.status==='expired')||x.b.sessions?.some(r=>r.user===id)).map(({b,g})=>`<article class="tile"><h3>${esc(b.name)} ${pill(!g?(b.grants.some(z=>z.user function startBot(b){if(!b?.managed||b.deletedAt){toast('Bot 不在纳管范围或已删除，不能启动');return}if(b.lifecycle==='running'){toast('Bot 已处于运行状态');return}if(b.lifecycle!=='stopped'){toast('停止状态尚未由 Host 确认；不能启动。');return}let err=[];if(!b.configured||!b.runtime||!b.modelRef||!b.systemPrompt?.trim())err.push('执行配置不完整，请先完成配置。');let policy=hostPolicy(b.hostNode,b.ownerId,b.runtime);if(policy)err.push(policy);if(b.hostState!=='在线')err.push('Host 离线，无法确认启动；请由 Host 所属用户恢复连接。');if(err.length){toast(err.join(' '));return}b.lifecycle='running';b.lifecycleVersion++;b.admission=true;b.state='运行中';addAudit(b,'启动 Bot','平台管理员',`${b.owner} · ${b.hostNode} · ${b.runtime} · 模拟状态变更；未调用 Host`);save();shell();toast('Bot 标记为运行中（仅原型状态，未启动真实进程）')}

function requestDelete(b){if(!b?.managed||b.deletedAt){toast('Bot 不在回收站外的纳管范围');return}if(b.lifecycle!=='stopped'){toast(b.lifecycle==='stop-unknown'?'Host 离线停止待确认；不能删除，需Host侧确认停止。':'请先停止 Bot；停止后再确认删除。');return}openDialog(`删除 Bot · ${esc(b.name)}`,`<div class="callout warn">对象：${esc(b.name)}<br>所属用户：${esc(b.owner)}<br>Host：${esc(b.host)}<br>当前授权：${b.grants.filter(g=>['active','pending'].includes(g.status)).length} 个 · 待审批：${b.pending.filter(x=>x.status==='pending').length} 个<br><br>本操作仅移入回收站：撤销授权/邀请，废止审批并释放预留；不删除 Host、用户、历史审计或使用者本人已取得的成果。可从回收站恢复为停止状态；授权不会自动恢复。<br><br>输入完整 Bot 名称确认。</div><div class="field" style="margin-top:12px"><label for="delete-name">确认名称</label><input id="delete-name" autocomplete="off" placeholder="${esc(b.name)}"><div id="delete-error"></div></div>`,`${button('取消','close-dialog','btn')}${button('移入回收站','confirm-delete','btn danger',`data-id="${b.id}"`)}`)}

function createInvite(){let f=document.getElementById('invite-form'),b=bot(f?.dataset.bot),user=f?.querySelector('#invite-user').value,resources=[...f.querySelectorAll('input[type=checkbox][value]:checked')].map(x=>x.value),daily=Number(f?.querySelector('#invite-daily').value),threshold=Number(f?.querySelector('#invite-threshold').value),err=[];if(!b?.managed||b.deletedAt||b.lifecycle!=='running'){toast('Bot 不在纳管范围、已删除或未运行；不能创建邀请。');return}if(!user)err.push('请选择指定用户。');if(!resources.length)err.push('至少选择一项授权资源。');if(resources.some(r=>!b.cap.resources.includes(r)||!b.resources.find(x=>x.name===r)?.shareable))err.push('资源超出所有者声明上限，不能分享。');if(!Number.isFinite(daily)||daily<1000||daily>b.cap.dailyMax)err.push(`成员日额度须在 1,000 到 ${b.cap.dailyMax.toLocaleString()} Token 之间。`);if(!Number.isFinite(threshold)||threshold<b.cap.thresholdMin)err.push(`审批阈值不得低于平台策略下限 ${b.cap.thresholdMin.toLocaleString()} Token。`);let same=user&&b.grants.find(g=>g.user===user&&((g.status==='active'||g.status==='pending')&&!expired(g.expires)));if(same)err.push(`${USER[user].name} 已有此 Bot 的${same.status==='active'?'有效授权':'待接受邀请'}。`);if(b.paused)err.push('Bot 共享已暂停，请恢复后再邀请。');if(b.hostState!=='在线')err.push('Host 离线，当前不能创建新授权。');if(err.length){document.getElementById('invite-error').innerHTML=`<div class="callout error">${err.map(esc).join('<br>')}</div>`;return}let role=f.querySelector('#invite-role').value,canEdit=role==='协作者'&&b.cap.canEdit&&!!f.querySelector('#invite-edit')?.checked,canAdmin=role==='共享管理员'&&b.cap.canAdmin&&!!f.querySelector('#invite-admin')?.checked;let g={id:'g'+(++s.grantSeq),user,role,resources,canEdit,canAdmin,daily,used:0,threshold,expires:f.querySelector('#invite-expires').value,status:'pending',version:1};b.grants.push(g);b.shared=true;addAudit(b,'创建待接受邀请','平台管理员',`${USER[user].name} · ${role} · ${resources.join('、')} · ${daily/1000}k/日`);save();closeDialog();shell();toast('邀请已创建，等待指定账号主动接受');}
function saveGrant(){let f=document.getElementById('grant-form'),b=bot(f?.dataset.bot),g=b?.grants.find(x=>x.id===f?.dataset.grant);if(!b?.managed||!g||g.status!=='active'){toast('授权已变化，保存失败');closeDialog();return}let role=f.querySelector('#grant-role').value,resources=[...f.querySelectorAll('input[type=checkbox][value]:checked')].map(x=>x.value),daily=Number(f.querySelector('#grant-daily').value),threshold=Number(f.querySelector('#grant-threshold').value),err=[];if(!resources.length)err.push('必须保留至少一项授权资源。');if(resources.some(r=>!b.cap.resources.includes(r)||!b.resources.find(x=>x.name===r)?.shareable))err.push('资源必须属于所有者声明的可共享上限。');if(daily<g.used||daily>b.cap.dailyMax)err.push(`日额度不能低于已使用量或高于上限 ${b.cap.dailyMax.toLocaleString()}。`);if(threshold<b.cap.thresholdMin)err.push(`审批阈值不得低于 ${b.cap.thresholdMin.toLocaleString()} Token。`);if(err.length){document.getElementById('grant-error').innerHTML=`<div class="callout error">${err.map(esc).join('<br>')}</div>`;return}g.role=role;g.resources=resources;g.daily=daily;g.threshold=threshold;g.expires=f.querySelector('#grant-exp').value;g.canEdit=role==='协作者'&&b.cap.canEdit&&f.querySelector('#grant-editable').checked;g.canAdmin=role==='共享管理员'&&b.cap.canAdmin&&f.querySelector('#grant-admin').checked;g.version=(g.version||0)+1;b.pending.filter(x=>x.grantId===g.id&&x.status==='pending').forEach(x=>x.status='expired');addAudit(b,'修改成员授权','平台管理员',`${USER[g.user].name} · ${role} · v${g.version} · ${resources.join('、')} · 旧审批失效`);save();closeDialog();shell();toast('授权已保存，旧授权版本下的审批已失效');}
function togglePause(b){if(!b?.managed||b.deletedAt){toast('此 Bot 不在纳管范围或已删除');return}b.paused=!b.paused;b.shared=b.grants.some(g=>g.status==='active'||g.status==='pending');b.shareVersion=(b.shareVersion||1)+1;if(b.paused)b.pending.filter(x=>x.status==='pending').forEach(x=>x.status='expired');addAudit(b,b.paused?'暂停 Bot 共享':'恢复 Bot 共享','平台管理员',`授权关系保留 · ${b.paused?'待审批已失效':'恢复后重新检查当前授权'} · Host 进程未触碰`);save();shell();toast(b.paused?'此 Bot 的网络共享已暂停；Host 仍运行':'此 Bot 共享已恢复');}
function handleUserInvite(b,gid,a){let id=s.usersim?.user,g=b?.grants.find(x=>x.id===gid);if(!b||!g||g.user!==id||g.status!=='pending'){toast('邀请未绑定当前模拟账号或已失效');return}if(expired(g.expires)){g.status='expired';addAudit(b,'邀请到期失效',USER[id].name,`${g.role} · ${g.expires} · 未接受`);save();renderUserView();toast('邀请已过期，请平台管理员重新邀请');return}if(a==='accept-user-invite'&&(b.paused||!b.shared||b.lifecycle!=='running'||b.deletedAt||b.hostState!=='在线')){toast(b.deletedAt?'Bot 已删除，不能接受邀请。':b.lifecycle!=='running'?'Bot 已停止，启动后才能接受邀请。':b.paused||!b.shared?'共享已暂停，暂时不能接受邀请。':'Host 离线，暂时不能接受邀请。');return}g.status=a==='accept-user-invite'?'active':'declined';g.version=(g.version||0)+1;b.shared=b.grants.some(x=>x.status==='active'||x.status==='pending');addAudit(b,a==='accept-user-invite'?'接受共享邀请':'拒绝共享邀请',USER[id].name,`${g.role} · v${g.version}`);save();renderUserView();toast(a==='accept-user-invite'?'已接受邀请，Bot 已加入共享列表':'已拒绝邀请');}
function runUserTask(b,cost){let id=s.usersim?.user,g=grant(b,id),title=document.getElementById('user-task')?.value.trim();if(!canSharedWrite(b,g)){toast(sharedWriteReason(b,g));return}if(!title){toast('请先填写任务内容');return}if(b.paused||!b.shared||b.lifecycle!=='running'||b.deletedAt||b.hostState!=='在线'){toast(b.paused||!b.shared?'Bot 共享已暂停，任务拒绝。':'Host 离线，任务拒绝；联系 Host 所有者恢复。');return}let pending=b.pending.filter(a=>a.user===id&&a.status==='pending'),reserved=pending.reduce((n,a)=>n+a.tokens,0),botReserved=b.pending.filter(a=>a.status==='pending').reduce((n,a)=>n+a.tokens,0);if(pending.some(a=>a.title===title)){toast('同一任务已在审批中，不重复创建');return}if(g.used+reserved+cost>g.daily){toast(`成员额度不足：可用 ${Math.max(0,g.daily-g.used-reserved)/1000}k（含待审批预留），预计 ${cost/1000}k。`);return}if(b.usage+botReserved+cost>b.dailyCap){toast('Bot 总额度不足；请联系所有者调整预算。');return}if(cost>g.threshold){b.pending.push({id:`p${Date.now()}${Math.random().toString(16).slice(2,6)}`,grantId:g.id,user:id,title,resources:g.resources.slice(),tokens:cost,status:'pending',version:g.version,shareVersion:b.shareVersion||1});addAudit(b,'提交任务待审批',USER[id].name,`${title} · 预计 ${cost/1000}k Token · 已预留 · 尚未执行`);save();renderUserView();toast('任务已提交审批并预留额度，尚未执行');return}g.used+=cost;b.usage+=cost;b.sessions=b.sessions||[];b.sessions.push({user:id,title,result:'本地模拟结果：已根据授权资料生成示例摘要。结果只保存在当前演示状态。',tokens:cost,time:'刚刚'});addAudit(b,'执行普通模拟任务',USER[id].name,`${cost/1000}k Token · 费用归属 Bot 所有者`);save();renderUserView();toast(`模拟任务完成，已记录 ${cost/1000}k Token`);}
function handleApproval(b,id,a){let p=b?.pending.find(x=>x.id===id&&x.status==='pending');if(!b?.managed||!p){toast('审批不存在、已处理或 Bot 不在纳管范围');return}let g=b.grants.find(x=>x.id===p.grantId&&x.status==='active'&&!expired(x.expires));if(!g||b.deletedAt||b.lifecycle!=='running'||g.version!==p.version||b.paused||b.hostState!=='在线'||(b.shareVersion||1)!==p.shareVersion){p.status='expired';addAudit(b,'审批已失效','平台管理员',`${p.title} · 授权/共享/Host 状态已变化，未执行`);save();shell();toast('授权版本、共享状态或 Host 已变化，审批失效且任务未执行');return}if(a==='approve'){if(g.used+b.pending.filter(x=>x.id!==p.id&&x.user===g.user&&x.status==='pending').reduce((n,x)=>n+x.tokens,0)+p.tokens>g.daily||b.usage+b.pending.filter(x=>x.id!==p.id&&x.status==='pending').reduce((n,x)=>n+x.tokens,0)+p.tokens>b.dailyCap){p.status='expired';addAudit(b,'审批额度复核失败','平台管理员',`${p.title} · 额度不足 · 未执行`);save();shell();toast('执行前额度复核失败，审批失效且未扣用量');return}p.status='approved';g.used+=p.tokens;b.usage+=p.tokens;b.sessions=b.sessions||[];b.sessions.push({user:p.user,title:p.title,result:'本地模拟结果：深度研究摘要已完成。仅向发起者显示，不向管理员或其他用户展示正文。',tokens:p.tokens,time:'刚刚'});addAudit(b,'批准并模拟执行','平台管理员',`${USER[p.user].name} · ${p.tokens/1000}k Token · v${g.version}`);save();shell();toast('审批已批准并模拟完成，实际模拟用量已结算');return}p.status='denied';addAudit(b,'拒绝高成本任务','平台管理员',`${USER[p.user].name} · 任务未执行，预留额度已释放`);save();shell();toast('已拒绝；任务未执行，预留额度已释放');}
function saveUserResource(b){let id=s.usersim?.user,g=grant(b,id),resource=document.getElementById('user-resource')?.value,content=document.getElementById('user-resource-content')?.value;if(!canSharedWrite(b,g)){toast(sharedWriteReason(b,g));renderUserView();return}if(!g?.canEdit||!g.resources.includes(resource)||!b.resources.some(r=>r.name===resource&&r.shareable)){toast('此账号没有该资料的维护权限');return}let r=b.resources.find(x=>x.name===resource);r.description=content;addAudit(b,'维护共享资料',USER[id].name,`${resource} · 授权范围内更新元数据`);save();toast('授权资料演示内容已保存并记录审计');}
function manageUserMembers(b){let id=s.usersim?.user,g=grant(b,id);if(!canSharedWrite(b,g)){toast(sharedWriteReason(b,g));renderUserView();return}if(!g?.canAdmin){toast('当前角色没有成员管理委派');return}let targets=b.grants.filter(x=>x.status==='active'&&x.user!==id&&rank(x.role)<rank(g.role));openDialog(`低级成员 · ${esc(b.name)}`,targets.map(x=>`<div class="logrow"><strong>${esc(USER[x.user]?.name||'用户')} · ${esc(x.role)}</strong><p>${x.resources.map(esc).join('、')}</p>${button('撤销该成员','user-revoke-lower','btn danger small',`data-id="${b.id}" data-grant="${x.id}"`)}</div>`).join('')||'<div class="empty">当前没有低于你角色的可管理成员。</div>',button('完成','close-dialog','btn'));}
