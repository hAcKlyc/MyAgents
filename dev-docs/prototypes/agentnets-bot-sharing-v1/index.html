function heading(title,desc,actions=''){return `<div class="crumb">服务实例 / ${esc(title)}</div><div class="head"><div><h1>${esc(title)}</h1><p>${desc}</p></div><div class="head-actions">${actions}</div></div>`}
function botsPage(){let q=s.filter.q.toLowerCase(),rows=s.bots.filter(b=>b.managed&&(!q||b.name.toLowerCase().includes(q)||b.owner.toLowerCase().includes(q))&&(!s.filter.status||b.state===s.filter.status)&&(!s.filter.host||b.hostNode===s.filter.host));let managed=s.bots.filter(b=>b.managed),shared=managed.filter(b=>b.shared&&!b.paused).length,used=managed.reduce((n,b)=>n+b.usage,0);return `${heading('Bots 管理控制台','管理当前服务实例内已纳管 Bot 的共享关系和权限边界。所有数值为合成演示数据。')}<div class="bots-layout ${s.detailFocus?'detail-focus':''}"><div class="directory-stack"><div class="stats"><div class="stat"><strong>${s.bots.filter(b=>b.managed).length}</strong><small>纳管 Bots</small></div><div class="stat"><strong>${new Set(s.bots.filter(b=>b.managed).map(b=>b.owner)).size}</strong><small>Bot 所有者</small></div><div class="stat"><strong>${shared}</strong><small>共享启用中</small></div><div class="stat"><strong>${(used/1000).toFixed(0)}k</strong><small>累计模拟用量 · Token</small></div></div><section class="card"><div class="cardhead"><div><h2>Bot 目录</h2><p>跨所有者、跨 Host 的纳管 Bot 清单</p></div><span class="muted">${rows.length} 个结果</span></div><div class="filters"><input id="search" value="${esc(s.filter.q)}" placeholder="搜索 Bot 名称或所有者" aria-label="搜索 Bot 名称或所有者"><select id="filter-status" aria-label="按状态筛选"><option value="">全部状态</option>${['运行中','待配置','异常'].map(x=>`<option ${s.filter.status===x?'selected':''}>${x}</option>`).join('')}</select><select id="filter-host" aria-label="按 Host 筛选"><option value="">全部 Host</option>${[...new Set(s.bots.filter(b=>b.managed).map(b=>b.hostNode))].map(x=>`<option value="${x}" ${s.filter.host===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="table-scroll"><table class="table"><thead><tr><th>Bot</th><th>所有者</th><th>运行 Host</th><th>可用状态</th><th>共享状态</th><th>成员</th><th>模拟用量</th><th></th></tr></thead><tbody>${rows.map(b=>`<tr><td><button class="botlink" data-open-bot="${b.id}">${esc(b.name)}</button><span class="sub">${b.managed?'当前实例 · 已纳管':'未纳管'}</span></td><td>${esc(b.owner)}</td><td>${esc(b.host)}<span class="sub">Host ${pill(b.hostState,b.hostState==='在线'?'ok':'bad')}</span></td><td>${pill(b.state,b.state==='运行中'?'ok':b.state==='异常'?'bad':'warn')}</td><td>${pill(resState(b),b.paused?'warn':b.shared?'blue':'')}</td><td>${b.grants.filter(g=>g.status==='active').length}</td><td>${(b.usage/1000).toFixed(0)}k / ${(b.dailyCap/1000).toFixed(0)}k</td><td>${button('详情','open-bot','btn small',`data-id="${b.id}"`)}</td></tr>`).join('')||`<tr><td colspan="8"><div class="empty">没有匹配的 Bot。调整搜索词或筛选条件。</div></td></tr>`}</tbody></table></div></section><div class="lower"><section class="card"><div class="cardhead"><div><h2>共享关系概览</h2><p>显示授权元数据，不显示会话正文</p></div></div><div class="pad"><div class="summary"><div>活跃成员</div><div>${s.bots.filter(b=>b.managed).reduce((n,b)=>n+b.grants.filter(g=>g.status==='active').length,0)} 个授权关系</div><div>待审批任务</div><div>${s.bots.filter(b=>b.managed).reduce((n,b)=>n+b.pending.filter(a=>a.status==='pending').length,0)} 个 · 已预留额度</div><div>共享暂停 Bot</div><div>${s.bots.filter(b=>b.paused).length} 个</div></div></div></section><section class="card"><div class="cardhead"><div><h2>管理边界</h2><p>平台管理权限与 Bot/Host 所有权分离</p></div></div><div class="pad"><div class="callout">平台管理员仅管理纳管 Bot 与所有者声明的可共享资源上限。私人会话、原始凭据与 Host OS 不可访问；暂停共享不会停止 Host 进程。</div></div></section></div> </div>${s.selected?`<div class="detail-column">${detailPanel(selected())}</div>`:''}</div>`}
function detailPanel(b){return `<section class="card" id="bot-detail"><div class="cardhead"><div><h2>${esc(b.name)}</h2><p>${esc(b.owner)} 所有 · ${esc(b.host)} · 共享上限由所有者声明</p></div><div class="cell-actions">${button(b.paused?'恢复共享':'暂停共享','toggle-pause',`btn ${b.paused?'':'danger'}`,`data-id="${b.id}"`)}${button('返回目录','back-directory','btn small')}</div></div><div class="tabs">${[['overview','概览'],['members','共享成员'],['resources','资源与权限'],['usage','额度与审计']].map(([id,n])=>`<button data-detail-tab="${id}" class="${s.detailTab===id?'on':''}">${n}</button>`).join('')}</div><div class="pad" style="padding-top:15px">${s.detailTab==='overview'?overview(b):s.detailTab==='members'?members(b):s.detailTab==='resources'?resourcePanel(b):usagePanel(b)}</div></section>`}
function overview(b){return `<div class="detail-grid"><div class="detail-stack"><div class="summary"><div>Bot 状态</div><div>${pill(b.state,b.state==='运行中'?'ok':b.state==='异常'?'bad':'warn')}</div><div>共享状态</div><div>${pill(resState(b),b.paused?'warn':b.shared?'blue':'')}</div><div>活跃成员</div><div>${b.grants.filter(g=>g.status==='active').length}</div><div>模拟 Token 用量</div><div>${(b.usage/1000).toFixed(0)}k / ${(b.dailyCap/1000).toFixed(0)}k 日上限</div><div>Host 连通性</div><div>${pill(b.hostState,b.hostState==='在线'?'ok':'bad')}</div></div></div><div class="callout">此为平台治理视图。可见共享关系与用量元数据；不读取任何使用者会话正文、私人记忆或凭据。${b.hostState==='离线'?'<br><br>Host 离线：拒绝新的模拟任务。请由 Host 所有者恢复连接；平台管理员没有 OS 管理权。':''}${!b.cap.resources.length?'<br><br>所有者尚未声明可共享资源上限。':''}</div></div>`}
function members(b){return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div><strong>共享成员与授权</strong><div class="muted">权限按 Bot 隔离；修改授权会递增版本并使旧审批失效。</div></div>${button('＋ 邀请用户','invite','btn primary small',`data-id="${b.id}"`)}</div>${b.paused?'<div class="callout warn" style="margin-bottom:12px">Bot 共享已暂停。现有成员授权保留，新任务不可发起；恢复后按当前授权版本重新校验。</div>':''}<div class="table-scroll"><table class="table" style="min-width:700px"><thead><tr><th>用户</th><th>角色</th><th>授权资料</th><th>日额度 / 已用</th><th>有效期</th><th>状态</th><th>操作</th></tr></thead><tbody>${b.grants.map(g=>`<tr><td><div class="person"><span class="avatar">${USER[g.user]?.initial||'?'}</span><span>${esc(USER[g.user]?.name||'未知用户')}<span class="sub">${esc(USER[g.user]?.mail||'')}</span></span></div></td><td>${esc(g.role)}${g.canAdmin?'<span class="sub">仅低级成员委派</span>':''}</td><td>${g.resources.map(x=>`<span class="pill">${esc(x)}</span>`).join(' ')||'—'}${g.canEdit?'<span class="sub">可维护授权资料</span>':''}</td><td>${(g.used/1000).toFixed(0)}k / ${(g.daily/1000).toFixed(0)}k</td><td>${esc(g.expires)}</td><td>${pill(g.status==='active'?(expired(g.expires)?'已到期':'有效'):g.status==='pending'?(expired(g.expires)?'邀请已过期':'待接受'):g.status==='expired'?'已过期':g.status==='declined'?'已拒绝':'已撤销',g.status==='active'&&!expired(g.expires)?'ok':g.status==='pending'&&!expired(g.expires)?'warn':'bad')}</td><td><div class="cell-actions">${g.status==='active'?button(expired(g.expires)?'续期 / 权限':'权限','edit-grant','btn small',`data-id="${b.id}" data-grant="${g.id}"`)+button('撤销','revoke','btn small danger',`data-id="${b.id}" data-grant="${g.id}"`):''}</div></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">此 Bot 尚无共享成员。邀请会绑定指定的已注册账号。</div></td></tr>'}</tbody></table></div><div class="callout" style="margin-top:13px">所有者保持不变。Bot 共享管理员仅能管理该 Bot 中被委派的低级成员，不能跨 Bot、改总预算或查看会话正文。</div>`}
function resourcePanel(b){return `<div class="detail-grid"><div class="detail-stack"><strong>所有者声明的可共享上限</strong>${b.resources.map(r=>`<label class="check ${r.shareable?'':'locked'}"><input type="checkbox" disabled ${r.shareable?'':'disabled'} ${b.cap.resources.includes(r.name)?'checked':''}><span><strong>${esc(r.name)} ${r.shareable?pill('允许进入授权范围','ok'):pill('禁止分享','bad')}</strong><small>${esc(r.description)}${!r.shareable?' · 平台管理员不能覆盖此限制':''}</small></span></label>`).join('')}</div><div class="detail-stack"><div class="summary"><div>角色可维护资料</div><div>${b.cap.canEdit?'所有者上限允许，需在单个 grant 明确授权':'所有者声明禁止'}</div><div>管理员委派</div><div>${b.cap.canAdmin?'可由所有者限域委派':'所有者未开放委派'}</div><div>单用户日额度上限</div><div>${(b.cap.dailyMax/1000).toFixed(0)}k Token</div><div>最低审批阈值</div><div>${(b.cap.thresholdMin/1000).toFixed(0)}k Token</div></div><div class="callout warn">灰色或禁止分享的资源不能被管理员添加。平台管理员不能取得超出 Bot 声明范围的权限。</div></div></div>`}
function usagePanel(b){return `<div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><strong>${(b.usage/1000).toFixed(0)}k</strong><small>Bot 累计模拟用量 Token</small></div><div class="stat"><strong>${(b.dailyCap/1000).toFixed(0)}k</strong><small>Bot 模拟日额度</small></div><div class="stat"><strong>${b.pending.filter(a=>a.status==='pending').length}</strong><small>待审批并预留额度</small></div></div><div class="logrow"><strong>用量说明</strong><div class="muted">仅为合成演示值，不连接模型供应商、不产生费用。审计只包含调用者、Bot、授权版本、操作和用量元数据。</div></div>${auditRows(b.audit)}</div>`}
function auditRows(rows){return rows.length?rows.slice(0,12).map(e=>`<div class="logrow"><strong>${esc(e.action)}</strong><div class="muted">${esc(e.actor)} · ${esc(e.bot)} · ${esc(e.detail)} · ${esc(e.time)}</div></div>`).join(''):'<div class="empty">暂无此范围内的审计事件。</div>'}
function botDetail(){let b=selected();if(!b)return '';return `<div style="margin-top:16px">${detailPanel(b)}</div>`}
function hostsPage(){let hs=[...new Map(s.bots.filter(b=>b.managed).map(b=>[b.hostNode,{name:b.hostNode,type:b.host.split(' · ')[0],state:b.hostState,bots:s.bots.filter(x=>x.managed&&x.hostNode===b.hostNode).length}])).values()];return `${heading('Hosts','只展示纳管 Bot 关联的 Host 元数据；平台管理员不获得 Host OS、凭据或设备管理权限。')}<div class="tilegrid">${hs.map(h=>`<article class="tile"><h3>${esc(h.name)}</h3><p class="muted">Host 节点 ${esc(h.name)} · 关联 ${h.bots} 个纳管 Bot · 状态为合成数据</p>${pill(h.state,h.state==='在线'?'ok':'bad')}<div style="margin-top:12px">${button('查看关联 Bots','filter-host','btn small',`data-host="${esc(h.name)}"`)} ${button('OS 管理','disabled-host','btn small',`disabled title="平台管理员无 Host OS 权限"`)}</div></article>`).join('')}</div>`}
function usersPage(){let all=new Set(s.bots.filter(b=>b.managed).flatMap(b=>b.grants.map(g=>g.user)));return `${heading('用户与权限','查看当前纳管 Bots 内的共享关系元数据，不枚举实例中无关的私人对象。')}<section class="card"><div class="table-scroll"><table class="table"><thead><tr><th>注册用户</th><th>参与共享 Bots</th><th>授权角色</th><th>模拟用量</th><th>权限边界</th></tr></thead><tbody>${Object.entries(USER).filter(([id])=>all.has(id)).map(([id,u])=>{let gs=s.bots.flatMap(b=>b.grants.filter(g=>g.user===id&&g.status==='active').map(g=>({g,b})));return `<tr><td><div class="person"><span class="avatar">${u.initial}</span><span>${esc(u.name)}<span class="sub">${esc(u.mail)}</span></span></div></td><td>${gs.map(x=>esc(x.b.name)).join('、')||'—'}</td><td>${gs.map(x=>esc(x.g.role)).join('、')||'—'}</td><td>${gs.reduce((n,x)=>n+x.g.used,0)/1000}k Token</td><td>只可访问逐项授权的 Bot 与资源</td></tr>`}).join('')}</tbody></table></div></section>`}
function approvalsPage(){let rows=s.bots.filter(b=>b.managed).flatMap(b=>b.pending.filter(a=>a.status==='pending').map(a=>({b,a})));return `${heading('操作审批','每项审批绑定 Bot、调用者、资源、费用归属和授权版本；提交时已预留额度。')}<section class="card">${rows.length?rows.map(({b,a})=>`<div class="pad" style="padding-top:15px;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:12px"><strong>${esc(a.title)}</strong>${pill('待审批 · 已预留','warn')}</div><div class="summary" style="margin-top:10px"><div>调用者</div><div>${esc(USER[a.user]?.name||'用户')}</div><div>Bot / 所有者</div><div>${esc(b.name)} · ${esc(b.owner)}</div><div>授权资源</div><div>${a.resources.map(esc).join('、')}</div><div>执行身份 / 费用</div><div>共享 Bot 模拟身份 · 费用由 Bot 所有者承担</div><div>预计用量</div><div>${a.tokens/1000}k Token · 合成估算</div><div>授权版本</div><div>v${a.version}</div></div><div style="display:flex;gap:8px;margin-top:12px">${button('批准并模拟执行','approve','btn primary small',`data-id="${b.id}" data-approval="${a.id}"`)}${button('拒绝','deny','btn danger small',`data-id="${b.id}" data-approval="${a.id}"`)}</div></div>`).join(''):'<div class="empty">当前没有待处理审批。</div>'}</section>`}
function auditPage(){return `${heading('用量与审计','全局视图仅显示合成用量与操作元数据，不记录私人会话正文。')}<div class="stats"><div class="stat"><strong>${s.bots.filter(b=>b.managed).reduce((n,b)=>n+b.usage,0)/1000}k</strong><small>累计模拟 Token</small></div><div class="stat"><strong>${s.bots.filter(b=>b.managed).reduce((n,b)=>n+b.grants.reduce((m,g)=>m+g.used,0),0)/1000}k</strong><small>共享用户模拟用量</small></div><div class="stat"><strong>${s.audit.length}</strong><small>审计事件</small></div><div class="stat"><strong>模拟</strong><small>计量来源</small></div></div><section class="card"><div class="cardhead"><h2>平台操作审计</h2></div><div class="pad">${auditRows(s.audit)}</div></section>`}
function content(){if(s.page==='bots')return botsPage();if(s.page==='hosts')return hostsPage();if(s.page==='users')return usersPage();if(s.page==='approvals')return approvalsPage();return auditPage()}
function openDialog(title,body,foot){focusBack=document.activeElement;document.getElementById('modal').innerHTML=`<div class="modalback" data-backdrop><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title"><div class="dialoghead"><h2 id="dlg-title">${title}</h2><button class="close" data-a="close-dialog" aria-label="关闭">×</button></div><div class="dialogbody">${body}</div><div class="dialogfoot">${foot}</div></section></div>`;let d=document.querySelector('.dialog');d.addEventListener('keydown',e=>{if(e.key==='Tab'){let all=[...d.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled)')];if(all.length&&e.shiftKey&&document.activeElement===all[0]){e.preventDefault();all.at(-1).focus()}else if(all.length&&!e.shiftKey&&document.activeElement===all.at(-1)){e.preventDefault();all[0].focus()}}});d.querySelector('input:not(:disabled),select:not(:disabled),button:not(:disabled)')?.focus()}
function closeDialog(){document.getElementById('modal').innerHTML='';focusBack?.focus?.()}
function invitation(b){if(!b.managed){toast('此 Bot 不在平台管理员纳管范围内');return}if(!b.cap.resources.length){toast('所有者尚未声明可共享资源上限，无法创建授权');return}openDialog(`邀请用户 · ${esc(b.name)}`,`<form id="invite-form" data-bot="${b.id}"><div class="formgrid"><div class="field full"><label for="invite-user">指定用户</label><select id="invite-user"><option value="">选择已注册用户</option>${Object.entries(USER).filter(([id])=>id!=='guest').map(([id,u])=>`<option value="${id}">${esc(u.name)} · ${esc(u.mail)}</option>`).join('')}</select></div><div class="field"><label for="invite-role">共享角色</label><select id="invite-role"><option>使用者</option><option>协作者</option><option>共享管理员</option></select></div><div class="field"><label for="invite-expires">有效期</label><select id="invite-expires"><option value="2026-12-31">至 2026-12-31</option><option value="2026-11-12">30 天</option><option value="2026-10-20">7 天</option><option value="2026-10-12">演示已过期 · 2026-10-12</option></select></div><div class="field"><label for="invite-daily">成员日额度 · Token</label><input id="invite-daily" type="number" min="1000" max="${b.cap.dailyMax}" step="1000" value="${Math.min(50000,b.cap.dailyMax)}"></div><div class="field"><label for="invite-threshold">单次审批阈值 · Token</label><input id="invite-threshold" type="number" min="${b.cap.thresholdMin}" step="1000" value="20000"></div><div class="field full"><label>授权资料范围（仅所有者声明可共享上限）</label>${b.resources.map(r=>`<label class="check ${r.shareable&&b.cap.resources.includes(r.name)?'':'locked'}"><input type="checkbox" value="${esc(r.name)}" ${r.shareable&&b.cap.resources.includes(r.name)?'':'disabled'}><span><strong>${esc(r.name)} ${r.shareable&&b.cap.resources.includes(r.name)?'':pill('不可分享','bad')}</strong><small>${esc(r.description)}${!r.shareable?' · 私人/敏感资源不可由平台管理员开放':''}</small></span></label>`).join('')}</div><div class="field full" id="invite-role-capability"></div><div class="field full"><div id="invite-error"></div><div class="callout" id="invite-summary">请选择用户与授权资料。该授权独立于所有者、调用者和费用承担人。</div></div></div></form>`,`${button('取消','close-dialog','btn')}${button('创建待接受邀请','create-invite','btn primary')}`);document.querySelectorAll('#invite-form input,#invite-form select').forEach(x=>x.addEventListener('change',()=>updateInviteSummary(b)));updateInviteSummary(b)}
function updateInviteSummary(b){let f=document.getElementById('invite-form');if(!f)return;let user=f.querySelector('#invite-user').value,role=f.querySelector('#invite-role').value,resources=[...f.querySelectorAll('input[type=checkbox][value]:checked')].map(x=>x.value),daily=Number(f.querySelector('#invite-daily').value),threshold=Number(f.querySelector('#invite-threshold').value),box=document.getElementById('invite-role-capability'),wasEdit=!!f.querySelector('#invite-edit')?.checked,wasAdmin=!!f.querySelector('#invite-admin')?.checked;box.innerHTML=role==='协作者'&&b.cap.canEdit?'<label class="check"><input id="invite-edit" type="checkbox"><span><strong>允许维护所选资料</strong><small>只在明确选定范围内，默认关闭</small></span></label>':role==='共享管理员'&&b.cap.canAdmin?'<label class="check"><input id="invite-admin" type="checkbox"><span><strong>委派低级成员管理</strong><small>限于此 Bot，不含总预算和 Host 管理</small></span></label>':'';if(f.querySelector('#invite-edit'))f.querySelector('#invite-edit').checked=wasEdit;if(f.querySelector('#invite-admin'))f.querySelector('#invite-admin').checked=wasAdmin;box.onchange=()=>updateInviteSummary(b);let edit=!!f.querySelector('#invite-edit')?.checked,admin=!!f.querySelector('#invite-admin')?.checked;document.getElementById('invite-summary').innerHTML=`目标：${user?esc(USER[user].name):'尚未选择'} · 角色：${esc(role)}<br>可读资料：${resources.length?resources.map(esc).join('、'):'尚未选择'}<br>资料维护：${edit?'仅所选资料':'关闭'} · 低级成员管理：${admin?'限本 Bot':'关闭'}<br>对外发送、Host OS：关闭<br>日额度：${Number.isFinite(daily)?daily.toLocaleString():'—'} / ${b.cap.dailyMax.toLocaleString()} Token · 审批阈值：${Number.isFinite(threshold)?threshold.toLocaleString():'—'} Token<br>会话与记忆独立 · 费用归属 Bot 所有者（模拟）`}

document.addEventListener('keydown',e=>{if(s.usersim){if(document.querySelector('#modal [role="dialog"]')){if(e.key==='Escape'){e.preventDefault();closeDialog()}return}if(e.key==='Escape'){e.preventDefault();closeUserView();return}if(e.key==='Tab'){let d=document.querySelector('.usersim'),all=[...d.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);if(!all.length)return;if(e.shiftKey&&(document.activeElement===all[0]||!d.contains(document.activeElement))){e.preventDefault();all.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===all.at(-1)){e.preventDefault();all[0].focus()}else if(!d.contains(document.activeElement)){e.preventDefault();all[0].focus()}}return}if(e.key==='Escape'&&document.querySelector('[role=dialog]'))closeDialog()});document.addEventListener('click',e=>{if(e.target.matches('[data-backdrop]'))closeDialog()});
function createInvite(){let f=document.getElementById('invite-form'),b=bot(f?.dataset.bot),user=f?.querySelector('#invite-user').value,resources=[...f.querySelectorAll('input[type=checkbox][value]:checked')].map(x=>x.value),daily=Number(f?.querySelector('#invite-daily').value),threshold=Number(f?.querySelector('#invite-threshold').value),err=[];if(!b?.managed){toast('Bot 不在纳管范围内，邀请被拒绝');return}if(!user)err.push('请选择指定用户。');if(!resources.length)err.push('至少选择一项授权资源。');if(resources.some(r=>!b.cap.resources.includes(r)||!b.resources.find(x=>x.name===r)?.shareable))err.push('资源超出所有者声明上限，不能分享。');if(!Number.isFinite(daily)||daily<1000||daily>b.cap.dailyMax)err.push(`成员日额度须在 1,000 到 ${b.cap.dailyMax.toLocaleString()} Token 之间。`);if(!Number.isFinite(threshold)||threshold<b.cap.thresholdMin)err.push(`审批阈值不得低于平台策略下限 ${b.cap.thresholdMin.toLocaleString()} Token。`);let same=user&&b.grants.find(g=>g.user===user&&['active','pending'].includes(g.status));if(same)err.push(`${USER[user].name} 已有此 Bot 的${same.status==='active'?'有效授权':'待接受邀请'}。`);if(b.paused)err.push('Bot 共享已暂停，请恢复后再邀请。');if(b.hostState!=='在线')err.push('Host 离线，当前不能创建新授权。');if(err.length){document.getElementById('invite-error').innerHTML=`<div class="callout error">${err.map(esc).join('<br>')}</div>`;return}let role=f.querySelector('#invite-role').value,canEdit=role==='协作者'&&b.cap.canEdit&&!!f.querySelector('#invite-edit')?.checked,canAdmin=role==='共享管理员'&&b.cap.canAdmin&&!!f.querySelector('#invite-admin')?.checked;let g={id:'g'+(++s.grantSeq),user,role,resources,canEdit,canAdmin,daily,used:0,threshold,expires:f.querySelector('#invite-expires').value,status:'pending',version:1};b.grants.push(g);b.shared=true;addAudit(b,'创建待接受邀请','平台管理员',`${USER[user].name} · ${role} · ${resources.join('、')} · ${daily/1000}k/日`);save();closeDialog();shell();toast('邀请已创建，等待指定账号主动接受');}
function saveGrant(){let f=document.getElementById('grant-form'),b=bot(f?.dataset.bot),g=b?.grants.find(x=>x.id===f?.dataset.grant);if(!b?.managed||!g||g.status!=='active'){toast('授权已变化，保存失败');closeDialog();return}let role=f.querySelector('#grant-role').value,resources=[...f.querySelectorAll('input[type=checkbox][value]:checked')].map(x=>x.value),daily=Number(f.querySelector('#grant-daily').value),threshold=Number(f.querySelector('#grant-threshold').value),err=[];if(!resources.length)err.push('必须保留至少一项授权资源。');if(resources.some(r=>!b.cap.resources.includes(r)||!b.resources.find(x=>x.name===r)?.shareable))err.push('资源必须属于所有者声明的可共享上限。');if(daily<g.used||daily>b.cap.dailyMax)err.push(`日额度不能低于已使用量或高于上限 ${b.cap.dailyMax.toLocaleString()}。`);if(threshold<b.cap.thresholdMin)err.push(`审批阈值不得低于 ${b.cap.thresholdMin.toLocaleString()} Token。`);if(err.length){document.getElementById('grant-error').innerHTML=`<div class="callout error">${err.map(esc).join('<br>')}</div>`;return}g.role=role;g.resources=resources;g.daily=daily;g.threshold=threshold;g.expires=f.querySelector('#grant-exp').value;g.canEdit=role==='协作者'&&b.cap.canEdit&&f.querySelector('#grant-editable').checked;g.canAdmin=role==='共享管理员'&&b.cap.canAdmin&&f.querySelector('#grant-admin').checked;g.version=(g.version||0)+1;b.pending.filter(x=>x.grantId===g.id&&x.status==='pending').forEach(x=>x.status='expired');addAudit(b,'修改成员授权','平台管理员',`${USER[g.user].name} · ${role} · v${g.version} · ${resources.join('、')} · 旧审批失效`);save();closeDialog();shell();toast('授权已保存，旧授权版本下的审批已失效');}
function togglePause(b){if(!b?.managed){toast('此 Bot 不在纳管范围内');return}b.paused=!b.paused;b.shared=b.grants.some(g=>g.status==='active'||g.status==='pending');b.shareVersion=(b.shareVersion||1)+1;if(b.paused)b.pending.filter(x=>x.status==='pending').forEach(x=>x.status='expired');addAudit(b,b.paused?'暂停 Bot 共享':'恢复 Bot 共享','平台管理员',`授权关系保留 · ${b.paused?'待审批已失效':'恢复后重新检查当前授权'} · Host 进程未触碰`);save();shell();toast(b.paused?'此 Bot 的网络共享已暂停；Host 仍运行':'此 Bot 共享已恢复');}
function handleUserInvite(b,gid,a){let id=s.usersim?.user,g=b?.grants.find(x=>x.id===gid);if(!b||!g||g.user!==id||g.status!=='pending'){toast('邀请未绑定当前模拟账号或已失效');return}if(expired(g.expires)){g.status='expired';addAudit(b,'邀请到期失效',USER[id].name,`${g.role} · ${g.expires} · 未接受`);save();renderUserView();toast('邀请已过期，请平台管理员重新邀请');return}if(a==='accept-user-invite'&&(b.paused||!b.shared||b.hostState!=='在线')){toast(b.paused||!b.shared?'共享已暂停，暂时不能接受邀请。':'Host 离线，暂时不能接受邀请。');return}g.status=a==='accept-user-invite'?'active':'declined';g.version=(g.version||0)+1;b.shared=b.grants.some(x=>x.status==='active'||x.status==='pending');addAudit(b,a==='accept-user-invite'?'接受共享邀请':'拒绝共享邀请',USER[id].name,`${g.role} · v${g.version}`);save();renderUserView();toast(a==='accept-user-invite'?'已接受邀请，Bot 已加入共享列表':'已拒绝邀请');}
function runUserTask(b,cost){let id=s.usersim?.user,g=grant(b,id),title=document.getElementById('user-task')?.value.trim();if(!canSharedWrite(b,g)){toast(sharedWriteReason(b,g));return}if(!title){toast('请先填写任务内容');return}if(b.paused||!b.shared||b.hostState!=='在线'){toast(b.paused||!b.shared?'Bot 共享已暂停，任务拒绝。':'Host 离线，任务拒绝；联系 Host 所有者恢复。');return}let pending=b.pending.filter(a=>a.user===id&&a.status==='pending'),reserved=pending.reduce((n,a)=>n+a.tokens,0),botReserved=b.pending.filter(a=>a.status==='pending').reduce((n,a)=>n+a.tokens,0);if(pending.some(a=>a.title===title)){toast('同一任务已在审批中，不重复创建');return}if(g.used+reserved+cost>g.daily){toast(`成员额度不足：可用 ${Math.max(0,g.daily-g.used-reserved)/1000}k（含待审批预留），预计 ${cost/1000}k。`);return}if(b.usage+botReserved+cost>b.dailyCap){toast('Bot 总额度不足；请联系所有者调整预算。');return}if(cost>g.threshold){b.pending.push({id:`p${Date.now()}${Math.random().toString(16).slice(2,6)}`,grantId:g.id,user:id,title,resources:g.resources.slice(),tokens:cost,status:'pending',version:g.version,shareVersion:b.shareVersion||1});addAudit(b,'提交任务待审批',USER[id].name,`${title} · 预计 ${cost/1000}k Token · 已预留 · 尚未执行`);save();renderUserView();toast('任务已提交审批并预留额度，尚未执行');return}g.used+=cost;b.usage+=cost;b.sessions=b.sessions||[];b.sessions.push({user:id,title,result:'本地模拟结果：已根据授权资料生成示例摘要。结果只保存在当前演示状态。',tokens:cost,time:'刚刚'});addAudit(b,'执行普通模拟任务',USER[id].name,`${cost/1000}k Token · 费用归属 Bot 所有者`);save();renderUserView();toast(`模拟任务完成，已记录 ${cost/1000}k Token`);}
function handleApproval(b,id,a){let p=b?.pending.find(x=>x.id===id&&x.status==='pending');if(!b?.managed||!p){toast('审批不存在、已处理或 Bot 不在纳管范围');return}let g=b.grants.find(x=>x.id===p.grantId&&x.status==='active'&&!expired(x.expires));if(!g||g.version!==p.version||b.paused||b.hostState!=='在线'||(b.shareVersion||1)!==p.shareVersion){p.status='expired';addAudit(b,'审批已失效','平台管理员',`${p.title} · 授权/共享/Host 状态已变化，未执行`);save();shell();toast('授权版本、共享状态或 Host 已变化，审批失效且任务未执行');return}if(a==='approve'){if(g.used+b.pending.filter(x=>x.id!==p.id&&x.user===g.user&&x.status==='pending').reduce((n,x)=>n+x.tokens,0)+p.tokens>g.daily||b.usage+b.pending.filter(x=>x.id!==p.id&&x.status==='pending').reduce((n,x)=>n+x.tokens,0)+p.tokens>b.dailyCap){p.status='expired';addAudit(b,'审批额度复核失败','平台管理员',`${p.title} · 额度不足 · 未执行`);save();shell();toast('执行前额度复核失败，审批失效且未扣用量');return}p.status='approved';g.used+=p.tokens;b.usage+=p.tokens;b.sessions=b.sessions||[];b.sessions.push({user:p.user,title:p.title,result:'本地模拟结果：深度研究摘要已完成。仅向发起者显示，不向管理员或其他用户展示正文。',tokens:p.tokens,time:'刚刚'});addAudit(b,'批准并模拟执行','平台管理员',`${USER[p.user].name} · ${p.tokens/1000}k Token · v${g.version}`);save();shell();toast('审批已批准并模拟完成，实际模拟用量已结算');return}p.status='denied';addAudit(b,'拒绝高成本任务','平台管理员',`${USER[p.user].name} · 任务未执行，预留额度已释放`);save();shell();toast('已拒绝；任务未执行，预留额度已释放');}
function saveUserResource(b){let id=s.usersim?.user,g=grant(b,id),resource=document.getElementById('user-resource')?.value,content=document.getElementById('user-resource-content')?.value;if(!canSharedWrite(b,g)){toast(sharedWriteReason(b,g));renderUserView();return}if(!g?.canEdit||!g.resources.includes(resource)||!b.resources.some(r=>r.name===resource&&r.shareable)){toast('此账号没有该资料的维护权限');return}let r=b.resources.find(x=>x.name===resource);r.description=content;addAudit(b,'维护共享资料',USER[id].name,`${resource} · 授权范围内更新元数据`);save();toast('授权资料演示内容已保存并记录审计');}
function manageUserMembers(b){let id=s.usersim?.user,g=grant(b,id);if(!canSharedWrite(b,g)){toast(sharedWriteReason(b,g));renderUserView();return}if(!g?.canAdmin){toast('当前角色没有成员管理委派');return}let targets=b.grants.filter(x=>x.status==='active'&&x.user!==id&&rank(x.role)<rank(g.role));openDialog(`低级成员 · ${esc(b.name)}`,targets.map(x=>`<div class="logrow"><strong>${esc(USER[x.user]?.name||'用户')} · ${esc(x.role)}</strong><p>${x.resources.map(esc).join('、')}</p>${button('撤销该成员','user-revoke-lower','btn danger small',`data-id="${b.id}" data-grant="${x.id}"`)}</div>`).join('')||'<div class="empty">当前没有低于你角色的可管理成员。</div>',button('完成','close-dialog','btn'));}
function rank(r){return r==='共享管理员'?3:r==='协作者'?2:1}
function userRevoke(b,gid){let id=s.usersim?.user,actorGrant=grant(b,id),g=b?.grants.find(x=>x.id===gid);if(!canSharedWrite(b,actorGrant)){toast(sharedWriteReason(b,actorGrant));closeDialog();renderUserView();return}if(!actorGrant?.canAdmin||!g||g.user===id||rank(g.role)>=rank(actorGrant.role)){toast('不能管理同级或更高级成员');return}g.status='revoked';g.version=(g.version||0)+1;b.pending.filter(x=>x.grantId===g.id&&x.status==='pending').forEach(x=>x.status='expired');addAudit(b,'共享管理员撤销成员',USER[id].name,`${USER[g.user].name} · 本 Bot · 待审批失效`);save();renderUserView();toast('低级成员授权已撤销');}
function renderListFromInput(){shell()}
shell();
