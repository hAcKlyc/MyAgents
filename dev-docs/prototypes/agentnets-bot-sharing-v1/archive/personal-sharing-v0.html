<style>

n:center;font-size:16px}.sidebar-note{margin:30px 8px 0;background:#f7f9fb;border:1px solid var(--line);border-radius:10px;padding:12px;color:#6e7d8d;font-size:12px}.content{padding:30px 34px 52px;min-width:0}.crumb{font-size:12px;color:var(--muted);margin-bottom:9px}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.heading h1{font-size:27px;line-height:1.25;margin:0 0 6px;font-weight:650;letter-spacing:-.02em}.heading p{margin:0;color:var(--muted)}.heading-actions{display:flex;gap:9px;align-items:center}.btn{border:1px solid #d7dfe8;background:#fff;color:#334255;border-radius:8px;padding:8px 12px;min-height:36px}.btn:hover{background:#f8fafc}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}.btn.primary:hover{background:#155fc9}.btn.danger{color:var(--red);border-color:#f1ceca}.btn.small{min-height:30px;padding:5px 9px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}.grid-main{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,.85fr);gap:18px}.stack{display:grid;gap:16px;align-content:start}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}.card-head{padding:17px 19px 13px;display:flex;align-items:center;justify-content:space-between;gap:12px}.card-head h2{font-size:15px;margin:0;font-weight:650}.card-head .sub{font-size:12px;color:var(--muted);margin-top:3px}.card-body{padding:0 19px 18px}.bot-row{display:flex;gap:14px;align-items:center}.bot-avatar{width:46px;height:46px;border-radius:12px;background:#eff5ff;display:grid;place-items:center;color:#2d73d5;font-size:22px;flex:none}.bot-name{font-weight:650;font-size:16px}.bot-meta{color:var(--muted);font-size:12px;margin-top:3px}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 8px;font-size:11px;white-space:nowrap;background:#f0f3f6;color:#667686}.pill.ok{background:var(--green-weak);color:var(--green)}.pill.wait{background:var(--amber-weak);color:var(--amber)}.pill.off{background:var(--red-weak);color:var(--red)}.pill.blue{background:var(--blue-weak);color:#286bc3}.divider{height:1px;background:var(--line);margin:15px 0}.member-list{display:grid}.member{display:grid;grid-template-columns:minmax(150px,1fr) 108px minmax(105px,.7fr) auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid #edf0f3}.member:first-child{border-top:0}.person{display:flex;align-items:center;gap:10px;min-width:0}.avatar{height:34px;width:34px;border-radius:50%;display:grid;place-items:center;background:#eaf0f8;color:#4c6b90;font-weight:650;flex:none}.avatar.purple{background:#f1ecff;color:#7359b5}.avatar.gold{background:#fff3dc;color:#9d711f}.person-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.person-sub{font-size:11px;color:var(--muted)}.role{font-size:12px;color:#56677b}.member-actions{display:flex;gap:6px;justify-content:flex-end}.summary-item{padding:11px 0;border-top:1px solid #edf0f3;display:flex;justify-content:space-between;gap:12px;font-size:13px}.summary-item:first-child{border-top:0}.summary-item span:first-child{color:var(--muted)}.summary-item strong{font-weight:600;text-align:right}.resource-chip{display:inline-block;margin:3px 4px 3px 0;padding:4px 8px;border:1px solid #e4eaf0;border-radius:6px;color:#526274;font-size:11px}.activity{display:grid;gap:0}.event{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-top:1px solid #edf0f3}.event:first-child{border-top:0}.event-icon{height:26px;width:26px;border-radius:50%;display:grid;place-items:center;background:#f1f5fa;color:#5b7592;font-size:12px}.event strong{font-weight:550}.event small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.notice{padding:11px 13px;border-radius:8px;background:#f4f8ff;color:#506984;font-size:12px;border:1px solid #e3ecfa}.notice.warn{background:var(--amber-weak);color:#775414;border-color:#f3e2ba}.notice.error{background:var(--red-weak);color:#9e3636;border-color:#f2d3d0}.notice.success{background:var(--green-weak);color:#256d50;border-color:#cce9d9}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;min-width:620px}.data-table th{text-align:left;color:#778594;font-size:11px;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}.data-table td{padding:12px;border-bottom:1px solid #edf0f3;font-size:13px;vertical-align:middle}.data-table tr:last-child td{border-bottom:0}.empty{padding:38px 20px;text-align:center;color:var(--muted)}.empty .emoji{font-size:26px;margin-bottom:8px}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin:0 0 17px;overflow:auto}.tabs button{border:0;background:none;padding:10px 12px;color:#68798b;white-space:nowrap;border-bottom:2px solid transparent}.tabs button.active{color:var(--blue);border-color:var(--blue);font-weight:600}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#596a7c;font-weight:600}.field input,.field select,.field textarea{width:100%;border:1px solid #d8e0e8;background:#fff;border-radius:8px;padding:9px 10px;color:var(--ink)}.field textarea{min-height:95px;resize:vertical}.checkrow{display:flex;gap:9px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:8px}.checkrow input{margin-top:3px}.checkrow strong{display:block;font-size:13px}.checkrow small{color:var(--muted);font-size:11px}.permission-summary{background:#f6f9fd;border:1px solid #e4ebf4;border-radius:10px;padding:13px}.permission-summary h3{margin:0 0 6px;font-size:13px}.permission-summary p{margin:0;color:#5f7185;font-size:12px}.modal-backdrop{position:fixed;inset:0;background:#13223573;z-index:10;display:grid;place-items:center;padding:18px}.dialog{width:min(610px,100%);max-height:min(90vh,850px);overflow:auto;background:white;border-radius:14px;box-shadow:0 28px 80px #14203338}.dialog-head{position:sticky;top:0;background:white;padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:1}.dialog-head h2{font-size:17px;margin:0}.dialog-body{padding:20px 22px}.dialog-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.xbtn{border:0;background:transparent;color:#768596;font-size:20px}.toast{position:fixed;right:24px;bottom:22px;background:#23364a;color:white;padding:12px 16px;border-radius:9px;box-shadow:0 6px 22px #10203030;z-index:20;max-width:min(400px,90vw)}.section-card{margin-bottom:16px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{padding:14px;background:#f8fafc;border-radius:9px}.metric strong{display:block;font-size:20px}.metric small{color:var(--muted)}.session-list{display:grid;gap:12px}.session{border:1px solid var(--line);border-radius:10px;padding:14px}.session-top{display:flex;justify-content:space-between;gap:12px}.session p{margin:7px 0 0;color:#56687a}.read-only{opacity:.72}.footer-note{margin-top:20px;text-align:center;color:#8a97a5;font-size:11px}
@media(max-width:1100px){.grid-main{grid-template-columns:minmax(0,1fr) minmax(230px,.75fr)}.content{padding:26px 23px}.member{grid-template-columns:minmax(130px,1fr) 88px 90px auto}.member-actions .btn span{display:none}}
@media(max-width:900px){.grid-main{grid-template-columns:1fr}}
@media(max-width:760px){.topbar{height:60px;padding:0 15px}.brand img{width:30px;height:30px}.brand small{display:none}.top-actions{gap:7px}.demo-label{font-size:10px}.identity{max-width:138px;padding:7px;font-size:12px}.layout{display:block;min-height:calc(100vh - 60px)}.sidebar{position:sticky;top:60px;z-index:3;padding:7px 10px;border-right:0;border-bottom:1px solid var(--line);overflow:auto}.nav-label,.sidebar-note{display:none}.nav{display:flex;min-width:max-content;gap:4px}.nav button{padding:8px 10px;font-size:12px}.nav button .ico{font-size:14px}.content{padding:21px 15px 38px}.heading{display:block}.heading h1{font-size:24px}.heading-actions{margin-top:14px}.grid-main{grid-template-columns:1fr}.stack.right{grid-row:auto}.member{grid-template-columns:minmax(0,1fr) auto;gap:7px;padding:12px 0}.member .role,.member .member-limit{display:none}.member-actions{grid-column:2;grid-row:1}.member-actions .btn span{display:none}.metrics{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.data-table{min-width:610px}}
@media(max-width:430px){.demo-label{display:none}.heading-actions .btn{flex:1}.card-head,.card-body{padding-left:14px;padding-right:14px}.card-head{padding-top:14px}.bot-row{align-items:flex-start}.bot-name{font-size:15px}.summary-item{font-size:12px}.dialog-backdrop{padding:8px}.dialog-body{padding:16px}.dialog-head,.dialog-foot{padding:14px 16px}.metrics{gap:8px}.metric{padding:11px}.metric strong{font-size:18px}}

<body><div id="app"></div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div>
<script>
(()=>{
const KEY='agentnets-bot-sharing-prototype-v1';
const PEOPLE={owner:{id:'owner',name:'周予安',title:'Bot 所有者',initial:'周',color:''},lin:{id:'lin',name:'林沐',title:'使用者',initial:'林',color:'purple'},chen:{id:'chen',name:'陈序',title:'协作者',initial:'陈',color:'gold'},xu:{id:'xu',name:'许知',title:'共享管理员',initial:'许',color:'purple'},guest:{id:'guest',name:'未授权访客',title:'无共享关系',initial:'访',color:''}};
const seed=()=>({actor:'owner',page:'manage',grantVersion:3,settings:{daily:50000,threshold:20000,resources:['客户研究资料库']},hostOnline:true,grantExpired:false,grants:[{user:'chen',role:'协作者',status:'active',resources:['客户研究资料库'],daily:50000,used:8000,threshold:20000,expires:'2026-12-31',canEdit:true,canManage:false},{user:'xu',role:'共享管理员',status:'active',resources:['客户研究资料库'],daily:50000,used:12000,threshold:20000,expires:'2026-12-31',canEdit:false,canManage:true,manageBelow:true}],invite:null,approvals:[],sessions:[],resources:{'客户研究资料库':'包含已审核的行业报告、公开市场数据摘要与客户研究模板。\n\n使用边界：仅限本 Bot 共享成员读取；不得写入客户个人信息或外部系统。','项目提案目录':'演示项目提案资料。\n\n仅可在明确授权范围内读取或维护。'},audit:[{action:'共享设置已启用',actor:'周予安',target:'客户研究 Bot',time:'今天 09:15',detail:'仅限指定成员与授权资料'}],showPrivate:false});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||seed()}catch{state=seed()}let toastTimer,returnFocus=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(state)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const person=id=>PEOPLE[id]||PEOPLE.guest,grant=id=>state.grants.find(g=>g.user===id),activeGrant=id=>{let g=grant(id);return g&&g.status==='active'&&!state.grantExpired?g:null},avatar=(id)=>{let p=person(id);return `<span class="avatar ${p.color}">${p.initial}</span>`},pill=(text,cls='')=>`<span class="pill ${cls}">${esc(text)}</span>`,btn=(text,action,cls='btn',data='')=>`<button class="${cls}" data-action="${action}" ${data}>${text}</button>`;
const nav=[['mine','▦','我的 Bot'],['shared','⇧','共享给我'],['manage','⚙','共享管理'],['invites','✉','邀请'],['approvals','✓','审批'],['audit','◷','用量与审计']];
function render(){document.getElementById('app').innerHTML=`<div class="shell"><header class="topbar"><div class="brand"><img src="../assets/moxbots-icon.png" alt="MoxBots"><span>MoxBots</span><small>AgentNets</small></div><div class="top-actions"><span class="demo-label">交互原型 · 数据均为模拟</span><select id="identity" class="identity" aria-label="切换模拟身份">${Object.values(PEOPLE).map(p=>`<option value="${p.id}" ${state.actor===p.id?'selected':''}>模拟身份 · ${p.name}</option>`).join('')}</select>${btn('重置演示','reset','btn small')}</div></header><div class="layout"><aside class="sidebar"><div class="nav-label">工作区</div><nav class="nav">${nav.map(([id,ico,label])=>`<button data-page="${id}" class="${state.page===id?'active':''}"><span class="ico">${ico}</span>${label}${id==='invites'&&state.invite&&state.invite.status==='pending'?pill('1','wait'):''}</button>`).join('')}</nav><div class="sidebar-note">身份切换仅用于体验权限边界。所有状态保存在此浏览器的本原型数据中。</div></aside><main class="content">${pageContent()}</main></div></div>`}
function heading(title,desc,actions=''){return `<div class="crumb">AgentNets / ${esc(title)}</div><div class="heading"><div><h1>${esc(title)}</h1><p>${desc}</p></div><div class="heading-actions">${actions}</div></div>`}
function botCard(privateBot=false){return `<article class="card"><div class="card-body" style="padding-top:18px"><div class="bot-row"><div class="bot-avatar">${privateBot?'◈':'✳'}</div><div style="min-width:0;flex:1"><div class="bot-name">${privateBot?'周予安的私人助理':'客户研究 Bot'} ${privateBot?pill('仅自己可见','blue'):pill('已启用共享','ok')}</div><div class="bot-meta">${privateBot?'私人 Bot · 不参与共享':'研究与整理客户行业信息 · 所有者：周予安'}</div></div>${!privateBot&&state.actor==='owner'?btn('共享默认设置','share-settings','btn small'):''}</div>${privateBot?'':`<div class="divider"></div><div style="font-size:12px;color:var(--muted);margin-bottom:5px">已选共享资料</div><span class="resource-chip">客户研究资料库 · 只读为默认</span><span class="resource-chip">会话与记忆 · 各自独立</span>`}</div></article>`}
function memberCard(){let people=['owner','lin','chen','xu'].filter(id=>id==='owner'||grant(id)||state.invite?.user===id);return `<article class="card"><div class="card-head"><div><h2>成员与授权</h2><div class="sub">按成员查看角色、范围与额度</div></div>${state.actor==='owner'?btn('＋ 邀请用户','invite','btn primary small'):''}</div><div class="card-body"><div class="member-list">${people.map(id=>{let p=person(id),g=grant(id)||((state.invite?.user===id)?state.invite:null),status=id==='owner'?'所有者':g?.status==='pending'?'待接受':g?.status==='revoked'?'已撤销':state.grantExpired&&id==='lin'?'已过期':'有效';let cls=status==='有效'||status==='所有者'?'ok':status==='待接受'?'wait':'off';let allowed=state.actor==='owner'&&id!=='owner'&&g?.status==='active'||state.actor==='xu'&&g?.status==='active'&&g?.manageBelow&&id==='lin';return `<div class="member"><div class="person">${avatar(id)}<div><div class="person-name">${esc(p.name)} ${id===state.actor?pill('当前身份','blue'):''}</div><div class="person-sub">${esc(p.title)}</div></div></div><div class="role">${id==='owner'?'所有者':esc(g?.role||'—')}</div><div class="member-limit">${g?.daily?`${((g.used||0)/1000).toFixed(0)}k / ${(g.daily/1000).toFixed(0)}k Token/日`:'—'}</div><div class="member-actions">${pill(status,cls)}${allowed?`${btn('权限','edit-grant','btn small',`data-user="${id}"`)}${btn('撤销','revoke','btn small danger',`data-user="${id}"`)}`:''}</div></div>`}).join('')}</div></div></article>`}
function summary(){let g=activeGrant(state.actor),owner=state.actor==='owner';return `<article class="card"><div class="card-head"><div><h2>${owner?'所有者管理范围':'共享范围摘要'}</h2><div class="sub">授权版本 v${state.grantVersion} · 模拟策略</div></div>${pill(state.hostOnline?'Host 在线':'Host 离线',state.hostOnline?'ok':'off')}</div><div class="card-body">${owner?`<div class="summary-item"><span>Bot 管理</span><strong>完整管理权限</strong></div><div class="summary-item"><span>成员管理</span><strong>邀请、调整与撤销授权</strong></div><div class="summary-item"><span>资料范围</span><strong>所有者可配置的共享资料</strong></div><div class="summary-item"><span>预算与费用策略</span><strong>仅所有者可设置</strong></div><div class="summary-item"><span>Host 管理</span><strong>独立管理授权</strong></div>`:g?`<div class="summary-item"><span>角色</span><strong>${esc(g.role)}</strong></div><div class="summary-item"><span>可读取资料</span><strong>${g.resources.map(esc).join('、')}</strong></div><div class="summary-item"><span>资料编辑</span><strong>${g.canEdit?'仅授权范围内':'关闭'}</strong></div><div class="summary-item"><span>成员管理委派</span><strong>${g.manageBelow?'仅低级成员':'关闭'}</strong></div><div class="summary-item"><span>日额度</span><strong>${(g.used/1000).toFixed(0)}k / ${(g.daily/1000).toFixed(0)}k Token</strong></div><div class="summary-item"><span>单次审批阈值</span><strong>${(g.threshold/1000).toFixed(0)}k Token</strong></div><div class="summary-item"><span>费用承担</span><strong>Bot 所有者 · 模拟</strong></div><div class="summary-item"><span>有效期</span><strong>${esc(g.expires)}</strong></div>`:`<div class="notice">${state.actor==='guest'?'当前身份没有此 Bot 的共享授权。':'当前身份无有效授权。'}</div>`}<div class="divider"></div><div class="notice">会话与记忆相互独立。所有者默认只能查看用量与审计元数据，不能读取成员会话正文。</div></div></article>`}
function activityCard(){let visible=state.audit.filter(e=>state.actor==='owner'||e.actor===person(state.actor).name||e.target===person(state.actor).name);return `<article class="card"><div class="card-head"><div><h2>最近操作</h2><div class="sub">仅显示授权范围内的审计元数据</div></div>${btn('查看全部','page-audit','btn small')}</div><div class="card-body"><div class="activity">${visible.slice(0,4).map(e=>`<div class="event"><div class="event-icon">◷</div><div><strong>${esc(e.action)}</strong><small>${esc(e.actor)} · ${esc(e.target)} · ${esc(e.time)}</small></div></div>`).join('')}</div></div></article>`}
function managePage(){let banner=state.actor==='owner'?'由你管理客户研究 Bot 的共享关系。每位成员的会话、记忆与用量独立。':state.actor==='xu'?'管理员可在委派范围内管理低级成员。自身角色、预算策略与 Host 管理由所有者控制。':state.actor==='chen'?'你可以维护已授权的共享资料；成员管理与预算设置由所有者负责。':'当前身份不具备共享管理权。';return `${heading('共享管理',banner,state.actor==='owner'?btn('＋ 邀请用户','invite','btn primary'): '')}<div class="grid-main"><div class="stack">${botCard()}${state.actor==='owner'||state.actor==='xu'?memberCard():''}</div><div class="stack right">${summary()}${activityCard()}${state.actor==='owner'?`<article class="card"><div class="card-head"><div><h2>共享安全边界</h2></div></div><div class="card-body"><div class="summary-item"><span>对外发送 / 写入</span><strong>默认关闭</strong></div><div class="summary-item"><span>Host 管理</span><strong>仅独立管理授权</strong></div><div class="summary-item"><span>会话正文共享</span><strong>关闭</strong></div><div class="divider"></div><div class="person-sub" style="margin-bottom:9px">演示异常状态（仅影响本地模拟数据）</div>${btn(state.grantExpired?'恢复林沐授权有效期':'模拟林沐授权过期','expire-lin','btn small')}</div></article>`:''}</div></div>`}
function minePage(){return `${heading('我的 Bot','查看你拥有或创建的 Bot。私人 Bot 只对本人显示。') }<div class="stack" style="max-width:850px">${botCard()}${state.actor==='owner'?botCard(true):''}<article class="card"><div class="card-head"><div><h2>最近会话</h2><div class="sub">会话正文仅对发起者可见</div></div></div><div class="card-body">${sessionList('mine')}</div></article></div>`}
function sharedPage(){let g=activeGrant(state.actor),revoked=grant(state.actor)?.status==='revoked',expired=state.grantExpired&&state.actor==='lin';return `${heading('共享给我','查看其他成员授予你的 Bot、范围与费用归属。')}${g?`<div class="grid-main"><div class="stack">${botCard()}<article class="card"><div class="card-head"><div><h2>独立会话</h2><div class="sub">内容只对 ${esc(person(state.actor).name)} 可见</div></div>${btn('＋ 新建会话','new-session','btn primary')}</div><div class="card-body">${sessionList('mine')}</div></article>${state.actor==='chen'?resourceEditor():''}</div><div class="stack right">${summary()}${taskCard()}</div></div>`:`<div class="stack" style="max-width:850px">${revoked||expired?`<div class="notice error">${revoked?'共享授权已撤销。你不能再执行新任务；本人已取得的演示成果仍保留。':'共享授权已过期。新的任务会被拒绝；本人已取得的演示成果仍可查看。'}<br>恢复方式：由所有者重新配置有效邀请并由你接受。</div>`:''}${revoked||expired?`<article class="card"><div class="card-head"><div><h2>本人演示成果</h2><div class="sub">共享关系失效后仍可查看已获得的成果</div></div></div><div class="card-body">${sessionList('mine')}</div></article>`:`<div class="card"><div class="empty"><div class="emoji">⌑</div><strong>${state.actor==='guest'?'没有可访问的共享 Bot':'当前没有已接受的共享'}</strong><p>只有指定账号主动接受邀请后，共享 Bot 才会出现在这里。</p></div></div>${inviteInbox()}`}</div>`}`}
function taskCard(){return `<article class="card"><div class="card-head"><div><h2>试运行模拟任务</h2><div class="sub">仅访问已授权资料 · 不调用模型</div></div></div><div class="card-body"><div class="notice warn" style="margin-bottom:12px">以下为界面模拟。任务结果与 Token 数均为合成数据。</div><div class="field"><label for="task-input">任务内容</label><textarea id="task-input" placeholder="例如：总结本季度行业变化">${esc(state.taskDraft||'')}</textarea></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 13px">${btn('普通研究 · 预计 5k','fill-task','btn small','data-value="整理行业趋势摘要"')}${btn('深度研究 · 预计 35k','fill-task','btn small','data-value="深度研究行业增长驱动因素与竞争格局"')}</div><div class="field"><label for="task-kind">任务类型</label><select id="task-kind"><option value="normal">普通任务 · 5k Token</option><option value="deep">深度研究 · 35k Token</option></select></div><div style="margin-top:13px">${btn('提交模拟任务','run-task','btn primary')}</div>${!state.hostOnline?'<div class="notice error" style="margin-top:12px">Host 离线，当前拒绝执行。恢复方式：在顶栏“演示控制”恢复模拟 Host。</div>':''}<div style="margin-top:12px">${btn(`演示控制：Host ${state.hostOnline?'在线':'离线'}`,'toggle-host','btn small')}</div></div></article>`}
function resourceEditor(){let g=activeGrant(state.actor);if(!g?.canEdit)return '';let available=g.resources.filter(r=>Object.hasOwn(state.resources,r));if(!available.length)return '';let selected=state.selectedResource&&available.includes(state.selectedResource)?state.selectedResource:available[0];state.selectedResource=selected;return `<article class="card"><div class="card-head"><div><h2>授权资料维护</h2><div class="sub">只能编辑已授权的共享资料</div></div>${pill(esc(g.role),'blue')}</div><div class="card-body"><div class="field"><label for="resource-select">授权资源</label><select id="resource-select">${available.map(r=>`<option ${r===selected?'selected':''}>${esc(r)}</option>`).join('')}</select></div><div class="field" style="margin-top:10px"><label for="resource-text">共享资料说明</label><textarea id="resource-text">${esc(state.resources[selected])}</textarea></div><div style="margin-top:11px">${btn('保存资料','save-resource','btn primary')}</div><p class="person-sub">保存会更新本地演示内容并记录审计元数据。</p></div></article>`}

function sessionList(which){let list=state.sessions.filter(s=>which==='mine'?s.owner===state.actor:true);if(!list.length)return '<div class="empty">尚无会话。提交一个模拟任务后，结果会显示在这里。</div>';return `<div class="session-list">${list.slice().reverse().map(s=>`<div class="session"><div class="session-top"><strong>${esc(s.title)}</strong>${pill(s.status==='pending'?'待审批':s.status==='approved'?'已完成':'已完成',s.status==='pending'?'wait':'ok')}</div><p>${s.owner===state.actor?esc(s.result||'等待审批后执行。'):'私人会话内容对你不可见。'}</p><div class="person-sub">${esc(person(s.owner).name)} · ${s.status==='pending'?'预估 35k Token · 尚未执行':`${s.tokens/1000}k Token · 费用归属：Bot 所有者 · ${esc(s.time)}`}</div></div>`).join('')}</div>`}
function inviteInbox(){let inv=state.invite;if(!inv||inv.status!=='pending')return '<div class="card"><div class="empty">暂无待处理邀请。</div></div>';if(inv.user!==state.actor)return '<div class="card"><div class="empty">有一条邀请，但目标账号不是当前身份。</div></div>';return `<article class="card"><div class="card-head"><div><h2>待接受邀请</h2><div class="sub">邀请绑定到你的模拟账号</div></div>${pill('待接受','wait')}</div><div class="card-body"><div class="bot-row"><div class="bot-avatar">✳</div><div><strong>客户研究 Bot</strong><div class="bot-meta">邀请者：周予安 · ${esc(inv.role)}</div></div></div><div class="divider"></div><div class="permission-summary"><h3>共享范围摘要</h3><p>可读取：${inv.resources.map(esc).join('、')}<br>编辑与对外发送：关闭<br>日额度：${inv.daily/1000}k Token · 单次审批阈值：${inv.threshold/1000}k Token<br>费用承担：Bot 所有者 · 模拟 · 有效期至 ${esc(inv.expires)}</p></div><div style="display:flex;gap:8px;margin-top:14px">${btn('接受邀请','accept-invite','btn primary')}${btn('拒绝','decline-invite','btn')}</div></div></article>`}
function invitePage(){return `${heading('邀请','邀请必须指定注册用户、角色、资源范围、额度和有效期。',state.actor==='owner'?btn('＋ 新建邀请','invite','btn primary'):'')}${inviteInbox()}<div style="height:14px"></div>${memberCard()}`}
function approvalsPage(){let isOwner=state.actor==='owner',visible=state.approvals.filter(a=>isOwner||a.user===state.actor);return `${heading('操作审批','高于成员单次阈值的任务先审批，再执行。审批仅覆盖这一次任务。')}<div class="stack" style="max-width:900px"><article class="card"><div class="card-head"><div><h2>待处理审批</h2><div class="sub">申请人、任务、资源和费用在执行前明确展示</div></div></div><div class="card-body">${visible.filter(a=>a.status==='pending').length?visible.filter(a=>a.status==='pending').map(a=>`<div class="session"><div class="session-top"><strong>${esc(a.title)}</strong>${pill('待审批','wait')}</div><p>申请人：${esc(person(a.user).name)} · 目标资料：${a.resources.map(esc).join('、')} · 预计 35k Token</p><div class="person-sub">执行身份：共享 Bot 模拟身份 · 费用承担：周予安 · 授权版本 v${a.version}</div>${isOwner?`<div style="display:flex;gap:8px;margin-top:12px">${btn('批准并执行','approve','btn primary small',`data-id="${a.id}"`)}${btn('拒绝','deny','btn small danger',`data-id="${a.id}"`)}</div>`:'<div class="person-sub" style="margin-top:10px">等待 Bot 所有者处理</div>'}</div>`).join(''):'<div class="empty">当前没有待处理审批。</div>'}</div></article><article class="card"><div class="card-head"><div><h2>审批历史</h2></div></div><div class="card-body">${visible.filter(a=>a.status!=='pending').map(a=>`<div class="event"><span class="event-icon">${a.status==='approved'?'✓':'×'}</span><div><strong>${esc(a.title)} · ${a.status==='approved'?'已批准并执行':'已拒绝'}</strong><small>${esc(person(a.user).name)} · 35k Token ${a.status==='approved'?'已结算':'未执行'}</small></div></div>`).join('')||'<div class="empty">暂无审批记录。</div>'}</div></article></div>`}
function auditPage(){let rows=state.audit.filter(e=>state.actor==='owner'||e.actor===person(state.actor).name||e.target===person(state.actor).name);return `${heading('用量与审计','记录共享关系与任务用量的元数据，不包含他人私人会话正文。')}<article class="card section-card"><div class="card-head"><div><h2>用量概览</h2><div class="sub">所有 Token 数字均为模拟值</div></div></div><div class="card-body"><div class="metrics"><div class="metric"><strong>${state.grants.reduce((n,g)=>n+g.used,0)/1000}k</strong><small>成员累计用量</small></div><div class="metric"><strong>${state.grants.filter(g=>g.status==='active').length}</strong><small>有效共享成员</small></div><div class="metric"><strong>${state.approvals.filter(a=>a.status==='pending').length}</strong><small>待处理审批</small></div></div></div></article><article class="card"><div class="card-head"><div><h2>操作记录</h2><div class="sub">操作者、对象、动作、结果与时间</div></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>操作</th><th>操作者</th><th>对象</th><th>结果 / 元数据</th><th>时间</th></tr></thead><tbody>${rows.map(e=>`<tr><td>${esc(e.action)}</td><td>${esc(e.actor)}</td><td>${esc(e.target)}</td><td>${esc(e.detail||'状态已更新')}</td><td>${esc(e.time)}</td></tr>`).join('')}</tbody></table></div></article>`}
function pageContent(){if(state.actor==='guest'&&state.page!=='shared')return `${heading('共享给我','此模拟身份没有 Bot 访问或管理权限。')}<div class="notice">无权访问此页面。只有接受指定邀请后，授权 Bot 才会显示。</div>`;if(state.page==='invites'&&state.actor!=='owner'&&state.invite?.user!==state.actor)return `${heading('邀请','当前身份没有可处理的邀请。')}<div class="empty">暂无可处理内容。</div>`;if(state.page==='mine'&&state.actor==='guest')return `${heading('我的 Bot','当前身份无 Bot 权限。')}<div class="empty">暂无可访问的 Bot。</div>`;if(state.page==='mine')return minePage();if(state.page==='shared')return sharedPage();if(state.page==='invites')return invitePage();if(state.page==='approvals')return approvalsPage();if(state.page==='audit')return auditPage();return managePage()}
function log(action,actor,target,detail){state.audit.unshift({action,actor,target,detail,time:new Date().toLocaleString('zh-CN',{hour:'2-digit',minute:'2-digit'})})}
function toast(msg){let root=document.getElementById('toast-root');root.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',3200)}
function openModal(title,body,foot){returnFocus=document.activeElement;document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" data-backdrop><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title">${title}</h2><button class="xbtn" aria-label="关闭" data-action="close-modal">×</button></div><div class="dialog-body">${body}</div><div class="dialog-foot">${foot}</div></section></div>`;const d=document.querySelector('.dialog');d.addEventListener('keydown',e=>{if(e.key==='Tab'){let f=[...d.querySelectorAll('button,input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled);if(!f.length)return;let first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});d.querySelector('input,select,button')?.focus()}
function closeModal(){document.getElementById('modal-root').innerHTML='';returnFocus?.focus?.()}
function settingsModal(){if(state.actor!=='owner'){toast('仅 Bot 所有者可修改默认共享设置');return}let st=state.settings;openModal('Bot 共享默认设置',`<form id="settings-form"><div class="form-grid"><div class="field full"><label>新邀请默认资料范围</label>${['客户研究资料库','项目提案目录'].map((x,i)=>`<label class="checkrow"><input type="checkbox" value="${x}" ${st.resources.includes(x)?'checked':''}><span><strong>${x}</strong><small>新邀请可选范围；仍需在每份邀请中明确确认</small></span></label>`).join('')}</div><div class="field"><label for="default-daily">默认日额度</label><select id="default-daily"><option value="50000" ${st.daily===50000?'selected':''}>50,000 Token</option><option value="25000" ${st.daily===25000?'selected':''}>25,000 Token</option><option value="10000" ${st.daily===10000?'selected':''}>10,000 Token</option></select></div><div class="field"><label for="default-threshold">默认审批阈值</label><select id="default-threshold"><option value="20000" ${st.threshold===20000?'selected':''}>20,000 Token</option><option value="10000" ${st.threshold===10000?'selected':''}>10,000 Token</option><option value="5000" ${st.threshold===5000?'selected':''}>5,000 Token</option></select></div></div><p class="person-sub">只影响之后创建的邀请，不会自动扩大现有成员权限。写入、对外发送和 Host 管理默认关闭。</p></form>`,`${btn('取消','close-modal','btn')}${btn('保存默认设置','save-settings','btn primary')}`)}
function editGrantModal(id){let g=grant(id);if(!g||g.status!=='active'||!(state.actor==='owner'||state.actor==='xu'&&grant('xu')?.manageBelow&&id==='lin')){toast('当前身份无权编辑此成员授权');return}openModal(`编辑 ${esc(person(id).name)} 的授权`, `<form id="grant-form" data-user="${id}"><div class="form-grid"><div class="field"><label for="grant-role">角色</label><select id="grant-role"><option ${g.role==='使用者'?'selected':''}>使用者</option><option ${g.role==='协作者'?'selected':''}>协作者</option>${state.actor==='owner'?`<option ${g.role==='共享管理员'?'selected':''}>共享管理员</option>`:''}</select></div><div class="field"><label for="grant-expires">有效期</label><select id="grant-expires"><option value="2026-12-31" ${g.expires==='2026-12-31'?'selected':''}>至 2026-12-31</option><option value="2026-11-13" ${g.expires==='2026-11-13'?'selected':''}>30 天</option><option value="2026-10-20" ${g.expires==='2026-10-20'?'selected':''}>7 天</option></select></div><div class="field"><label for="grant-daily">日额度</label><select id="grant-daily"><option value="50000" ${g.daily===50000?'selected':''}>50,000 Token</option><option value="25000" ${g.daily===25000?'selected':''}>25,000 Token</option><option value="10000" ${g.daily===10000?'selected':''}>10,000 Token</option></select></div><div class="field"><label for="grant-threshold">单次审批阈值</label><select id="grant-threshold"><option value="20000" ${g.threshold===20000?'selected':''}>20,000 Token</option><option value="10000" ${g.threshold===10000?'selected':''}>10,000 Token</option><option value="5000" ${g.threshold===5000?'selected':''}>5,000 Token</option></select></div><div class="field full"><label>可访问资料</label>${['客户研究资料库','项目提案目录'].map(x=>`<label class="checkrow"><input type="checkbox" value="${x}" ${g.resources.includes(x)?'checked':''}><span><strong>${x}</strong><small>仅明确勾选的资料可访问</small></span></label>`).join('')}</div><div class="field full"><label class="checkrow"><input type="checkbox" id="grant-edit" ${g.canEdit?'checked':''}><span><strong>资料维护</strong><small>仅限上方所选资料范围</small></span></label><label class="checkrow"><input type="checkbox" id="grant-delegate" ${g.manageBelow?'checked':''}><span><strong>委派低级成员管理</strong><small>不能调整自身角色、预算策略、同级或更高级成员、Host</small></span></label></div><div class="field full"><div id="grant-error"></div></div></div></form>`,`${btn('取消','close-modal','btn')}${btn('保存授权','save-grant','btn primary')}`)}
function inviteModal(){if(state.actor!=='owner'){toast('仅 Bot 所有者可以发起邀请');return}openModal('邀请用户',`<form id="invite-form"><div class="form-grid"><div class="field full"><label for="invite-user">邀请对象</label><select id="invite-user"><option value="">请选择目标用户</option><option value="lin">林沐 · lin.demo@example.test</option><option value="chen">陈序 · chen.demo@example.test</option><option value="xu">许知 · xu.demo@example.test</option></select></div><div class="field"><label for="invite-role">角色</label><select id="invite-role"><option>使用者</option><option>协作者</option><option>共享管理员</option></select></div><div class="field"><label for="invite-expires">有效期</label><select id="invite-expires"><option value="2026-12-31">至 2026-12-31</option><option value="2026-11-13">30 天</option><option value="2026-10-20">7 天</option></select></div><div class="field"><label for="invite-daily">日额度（Token）</label><select id="invite-daily"><option value="50000" ${state.settings.daily===50000?'selected':''}>50,000</option><option value="25000" ${state.settings.daily===25000?'selected':''}>25,000</option><option value="10000" ${state.settings.daily===10000?'selected':''}>10,000</option></select></div><div class="field"><label for="invite-threshold">单次审批阈值</label><select id="invite-threshold"><option value="20000" ${state.settings.threshold===20000?'selected':''}>20,000 Token</option><option value="10000" ${state.settings.threshold===10000?'selected':''}>10,000 Token</option><option value="5000" ${state.settings.threshold===5000?'selected':''}>5,000 Token</option></select></div><div class="field full"><label>授权资料范围（必须明确选择）</label><label class="checkrow"><input type="checkbox" value="客户研究资料库" ${state.settings.resources.includes('客户研究资料库')?'checked':''}><span><strong>客户研究资料库</strong><small>行业报告、公开市场摘要和研究模板</small></span></label><label class="checkrow"><input type="checkbox" value="项目提案目录" ${state.settings.resources.includes('项目提案目录')?'checked':''}><span><strong>项目提案目录</strong><small>模拟提案资料 · 只读</small></span></label></div><div class="field full" id="role-permissions"></div><div class="field full"><div id="invite-error" aria-live="polite"></div></div><div class="field full"><div class="permission-summary"><h3>共享范围 · 动态摘要</h3><p id="summary-text">选择目标、角色和资料后，这里将展示该成员可访问的内容、费用归属与限制。</p></div></div></div></form>`,`${btn('取消','close-modal','btn')}${btn('创建待接受邀请','create-invite','btn primary')}`);document.querySelectorAll('#invite-form select,#invite-form input').forEach(el=>el.addEventListener('change',updateInviteSummary));updateInviteSummary()}
function updateInviteSummary(){let f=document.getElementById('invite-form');if(!f)return;let u=f.querySelector('#invite-user').value,r=f.querySelector('#invite-role').value,d=f.querySelector('#invite-daily').value,t=f.querySelector('#invite-threshold').value,resources=[...f.querySelectorAll('input[type=checkbox][value]:checked')].map(x=>x.value),permissions=document.getElementById('role-permissions'),wasEdit=!!f.querySelector('#invite-edit')?.checked,wasDelegate=!!f.querySelector('#invite-delegate')?.checked;if(r==='协作者')permissions.innerHTML='<label class="checkrow"><input type="checkbox" id="invite-edit"><span><strong>允许维护所选共享资料</strong><small>仅限当前勾选的资料资源；默认关闭</small></span></label>';else if(r==='共享管理员')permissions.innerHTML='<label class="checkrow"><input type="checkbox" id="invite-delegate"><span><strong>委派低级成员管理</strong><small>仅可管理低于自身的成员；不能修改自身角色、预算或 Host</small></span></label>';else permissions.innerHTML='';if(f.querySelector('#invite-edit'))f.querySelector('#invite-edit').checked=wasEdit;if(f.querySelector('#invite-delegate'))f.querySelector('#invite-delegate').checked=wasDelegate;permissions.onchange=updateInviteSummary;let edit=!!f.querySelector('#invite-edit')?.checked,delegate=!!f.querySelector('#invite-delegate')?.checked;document.getElementById('summary-text').innerHTML=`目标账号：${u?esc(person(u).name):'尚未选择'} · 角色：${esc(r)}<br>可读取：${resources.length?resources.map(esc).join('、'):'尚未选择资料'}<br>资料维护：${edit?'仅所选资源':'关闭'} · 成员管理：${delegate?'仅低级成员':'关闭'}<br>对外发送、Host 管理：关闭<br>日额度：${Number(d)/1000}k Token · 单次审批阈值：${Number(t)/1000}k Token<br>费用承担：Bot 所有者 · 模拟 · 独立会话与记忆`}

document.addEventListener('click',e=>{let page=e.target.closest('[data-page]');if(page){state.page=page.dataset.page;save();render();return}let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;if(a==='reset'){openModal('重置演示数据','<div class="notice warn">这会清除本原型专用的本地数据，并恢复初始合成演示状态。</div>',`${btn('取消','close-modal','btn')}${btn('重置本原型','confirm-reset','btn danger')}`);return}if(a==='confirm-reset'){localStorage.removeItem(KEY);state=seed();closeModal();render();toast('本原型已重置');return}if(a==='expire-lin'){if(state.actor!=='owner'){toast('仅所有者可以管理授权有效期');return}state.grantExpired=!state.grantExpired;state.grantVersion++;log(state.grantExpired?'模拟授权过期':'恢复授权有效期','周予安','林沐',`授权版本 v${state.grantVersion}`);save();render();toast(state.grantExpired?'已模拟授权过期，新任务会被拒绝':'演示授权有效期已恢复');return}if(a==='invite'){inviteModal();return}if(a==='share-settings'){settingsModal();return}if(a==='edit-grant'){editGrantModal(b.dataset.user);return}if(a==='close-modal'){closeModal();return}if(a==='save-settings'){if(state.actor!=='owner'){toast('仅所有者可以保存 Bot 默认设置');closeModal();return}let f=document.getElementById('settings-form'),resources=[...f.querySelectorAll('input[type=checkbox][value]:checked')].map(x=>x.value);if(!resources.length){toast('至少保留一项默认资料范围');return}state.settings={daily:Number(f.querySelector('#default-daily').value),threshold:Number(f.querySelector('#default-threshold').value),resources};state.grantVersion++;log('更新共享默认设置','周予安','客户研究 Bot',`默认日额度 ${state.settings.daily/1000}k · 审批阈值 ${state.settings.threshold/1000}k · ${resources.join('、')}`);save();closeModal();render();toast('新邀请默认设置已保存，现有授权未扩大');return}if(a==='save-grant'){let f=document.getElementById('grant-form'),id=f?.dataset.user,g=grant(id);if(!g||!(state.actor==='owner'||state.actor==='xu'&&grant('xu')?.manageBelow&&id==='lin')){toast('授权范围已变化，保存未执行');closeModal();return}let resources=[...f.querySelectorAll('input[type=checkbox][value]:checked')].map(x=>x.value),daily=Number(f.querySelector('#grant-daily').value),role=f.querySelector('#grant-role').value,canEdit=f.querySelector('#grant-edit').checked,manageBelow=f.querySelector('#grant-delegate').checked;if(!resources.length){document.getElementById('grant-error').innerHTML='<div class="notice error">至少选择一项授权资料范围。</div>';return}if(daily<g.used){document.getElementById('grant-error').innerHTML='<div class="notice error">日额度不能低于该成员已使用的模拟额度。</div>';return}if(state.actor==='xu'&&(role==='共享管理员'||daily>grant('xu').daily||resources.some(x=>!grant('xu').resources.includes(x))||canEdit&&!grant('xu').canEdit||manageBelow)){document.getElementById('grant-error').innerHTML='<div class="notice error">委派范围不能超过你的自身授权，且不能给成员提升到共享管理员。</div>';return}g.role=role;g.resources=resources;g.daily=daily;g.threshold=Number(f.querySelector('#grant-threshold').value);g.expires=f.querySelector('#grant-expires').value;g.canEdit=canEdit;g.manageBelow=manageBelow;g.canManage=manageBelow;state.grantVersion++;state.approvals.filter(x=>x.user===id&&x.status==='pending').forEach(x=>x.status='expired');log('修改成员授权',person(state.actor).name,person(id).name,`授权版本 v${state.grantVersion} · ${role} · ${resources.join('、')} · ${daily/1000}k/日`);save();closeModal();render();toast('授权已更新；旧版本的待审批任务已失效');return}if(a==='create-invite'){let f=document.getElementById('invite-form'),u=f.querySelector('#invite-user').value,rs=[...f.querySelectorAll('input[type=checkbox][value]:checked')].map(x=>x.value),err=[];if(!u)err.push('请选择邀请目标。');if(!rs.length)err.push('至少选择一项授权资料范围。');if(u==='owner')err.push('不能邀请自己。');let existing=grant(u);if(existing&&['active','pending'].includes(existing.status))err.push(`${person(u).name} 已有${existing.status==='active'?'有效授权':'待接受邀请'}，不能重复邀请。`);if(err.length){document.getElementById('invite-error').innerHTML=`<div class="notice error">${err.map(esc).join('<br>')}</div>`;return}state.invite={user:u,role:f.querySelector('#invite-role').value,resources:rs,daily:Number(f.querySelector('#invite-daily').value),threshold:Number(f.querySelector('#invite-threshold').value),expires:f.querySelector('#invite-expires').value,canEdit:!!f.querySelector('#invite-edit')?.checked,canManage:!!f.querySelector('#invite-delegate')?.checked,manageBelow:!!f.querySelector('#invite-delegate')?.checked,status:'pending'};log('创建共享邀请','周予安',person(u).name,`${state.invite.role} · ${rs.join('、')} · 日额度 ${state.invite.daily/1000}k`);save();closeModal();state.page='manage';render();toast('邀请已创建，等待目标账号接受');return}if(a==='accept-invite'||a==='decline-invite'){let i=state.invite;if(!i||i.user!==state.actor||i.status!=='pending'){toast('当前身份无权处理此邀请');return}if(a==='accept-invite'){i.status='accepted';state.grants.push({...i,status:'active',used:0});state.grantVersion++;log('接受共享邀请',person(state.actor).name,'客户研究 Bot',`${i.role} · 授权版本 v${state.grantVersion}`);toast('已接受邀请，客户研究 Bot 已加入“共享给我”')}else{i.status='declined';log('拒绝共享邀请','林沐','客户研究 Bot','邀请未形成授权');toast('已拒绝邀请')}state.page='shared';save();render();return}if(a==='revoke'){let u=b.dataset.user;if(!(state.actor==='owner'||state.actor==='xu'&&grant('xu')?.manageBelow&&u==='lin')){toast('当前身份无权撤销此成员');return}let g=grant(u);if(!g||g.status!=='active'){toast('此成员没有有效授权');return}openModal('确认撤销共享',`<div class="notice error"><strong>将撤销 ${esc(person(u).name)} 对“客户研究 Bot”的访问。</strong><br>该成员无法再发起新任务；本人已取得的演示成果会保留。操作记录会显示操作者与授权版本。</div>`,`${btn('取消','close-modal','btn')}${btn('确认撤销','confirm-revoke','btn danger',`data-user="${u}"`)}`);return}if(a==='confirm-revoke'){let u=b.dataset.user,g=grant(u);if(!g||!(state.actor==='owner'||state.actor==='xu'&&grant('xu')?.manageBelow&&u==='lin')){toast('权限已变化，撤销未执行');closeModal();return}g.status='revoked';state.grantVersion++;log('撤销共享授权',person(state.actor).name,person(u).name,`授权版本 v${state.grantVersion} · 后续任务拒绝`);save();closeModal();render();toast(`${person(u).name} 的共享授权已撤销`);return}if(a==='toggle-host'){if(state.actor!=='lin'){toast('仅在林沐身份下可切换演示 Host 状态');return}state.hostOnline=!state.hostOnline;save();render();toast(`模拟 Host 已${state.hostOnline?'恢复在线':'设为离线'}`);return}if(a==='fill-task'){state.taskDraft=b.dataset.value;save();render();return}if(a==='run-task'){runTask();return}if(a==='new-session'){if(!activeGrant(state.actor)){toast('当前授权无效，不能创建新会话');return}state.taskDraft='';render();document.getElementById('task-input')?.focus();toast('已准备独立模拟会话');return}if(a==='save-resource'){let g=activeGrant(state.actor),resource=document.getElementById('resource-select')?.value,el=document.getElementById('resource-text');if(!g?.canEdit||!resource||!g.resources.includes(resource)||!Object.hasOwn(state.resources,resource)){toast('当前身份无权编辑此共享资料');return}if(!el)return;state.resources[resource]=el.value;state.selectedResource=resource;log('保存授权资料',person(state.actor).name,resource,`${g.role} 在授权范围内更新说明`);save();render();toast('共享资料已保存并记录审计');return}if(a==='approve'||a==='deny'){if(state.actor!=='owner'){toast('仅 Bot 所有者可审批');return}let ap=state.approvals.find(x=>x.id===b.dataset.id&&x.status==='pending');if(!ap){toast('审批已处理或已失效');return}if(state.grantVersion!==ap.version||!activeGrant(ap.user)||!state.hostOnline||activeGrant(ap.user).used+(ap.tokens||35000)>activeGrant(ap.user).daily){toast('授权版本变化或 Host 离线，审批不能执行；请重新检查权限与状态');ap.status='expired';save();render();return}ap.status=a==='approve'?'approved':'denied';let g=activeGrant(ap.user);if(a==='approve'){g.used+=(ap.tokens||35000);state.sessions.push({owner:ap.user,title:ap.title,result:'模拟研究完成：行业增长主要由需求结构变化、渠道效率提升与产品组合优化驱动。以上为本地合成结果。',tokens:ap.tokens||35000,status:'approved',time:'刚刚'});log('审批并执行高成本任务','周予安',person(ap.user).name,`深度研究 · ${(ap.tokens||35000)/1000}k Token · 模拟结算`)}else log('拒绝高成本任务','周予安',person(ap.user).name,'任务未执行 · 未结算用量');save();render();toast(a==='approve'?'已批准并完成模拟任务':'已拒绝；任务未执行');return}if(a==='page-audit'){state.page='audit';save();render();return}}
);
function runTask(){let text=document.getElementById('task-input')?.value.trim(),kind=document.getElementById('task-kind')?.value;if(!text){toast('请先填写任务内容');return}state.taskDraft=text;let g=activeGrant(state.actor);if(state.actor==='owner'||!g){toast(state.grantExpired&&state.actor==='lin'?'授权已过期，任务被拒绝。恢复方式：由所有者重新发出邀请并由你接受。':grant(state.actor)?.status==='revoked'?'授权已撤销，无法执行新任务。':'当前身份没有有效授权，任务被拒绝。');save();return}if(!state.hostOnline){toast('Host 离线，任务已拒绝；恢复模拟 Host 后可重试');save();return}let cost=kind==='deep'?35000:5000,pending=state.approvals.filter(a=>a.user===state.actor&&a.status==='pending'),reserved=pending.reduce((n,a)=>n+(a.tokens||35000),0),duplicate=pending.some(a=>a.title===text);if(duplicate){toast('相同任务已在审批中，请等待审批结果后再提交');return}if(g.used+reserved+cost>g.daily){toast(`日额度不足：可用 ${Math.max(0,g.daily-g.used-reserved)/1000}k，预计 ${cost/1000}k Token（含待审批预留）。可联系所有者调整额度。`);save();return}if(cost>g.threshold){let id='ap-'+Date.now();state.approvals.push({id,user:state.actor,title:text,resources:g.resources,tokens:cost,status:'pending',version:state.grantVersion});log('提交高成本任务审批',person(state.actor).name,'客户研究 Bot',`预计 ${cost/1000}k Token · 已预留额度 · 尚未执行`);state.page='approvals';save();render();toast('已提交审批并预留额度，任务尚未执行或结算');return}g.used+=cost;state.sessions.push({owner:state.actor,title:text,result:'模拟摘要：行业需求稳中有升，竞争重点集中在服务响应、数据质量与细分场景适配。内容仅为本地演示结果。',tokens:cost,status:'approved',time:'刚刚'});log('执行模拟任务',person(state.actor).name,'客户研究 Bot',`普通研究 · ${cost/1000}k Token · 费用归属 Bot 所有者`);save();render();toast(`模拟任务完成，已记录 ${cost/1000}k Token`)}
