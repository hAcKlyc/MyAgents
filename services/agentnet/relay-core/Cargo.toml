[package]
name = "myagents-agentnet-relay-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "AGPL-3.0-only"
publish = false

[dependencies]
base64 = "=0.22.1"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
myagents-agent-network-protocol = { path = "../../../src-tauri/agent-network-protocol" }
myagents-agentnet-admission-core = { path = "../admission-core" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.17"
url = "=2.5.7"
uuid = { version = "=1.18.1", features = ["v4"] }

[dev-dependencies]
myagents-agent-network-crypto = { path = "../../../src-tauri/agent-network-crypto" }
myagents-agentnet-identity-core = { path = "../identity-core" }
tempfile = "=3.23.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
