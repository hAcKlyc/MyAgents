[package]
name = "myagents-agentnet-peer-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "AGPL-3.0-only"

[dependencies]
base64 = "=0.22.1"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
libc = "=0.2.190"
myagents-agent-network-crypto = { path = "../../../src-tauri/agent-network-crypto" }
myagents-agent-network-protocol = { path = "../../../src-tauri/agent-network-protocol" }
myagents-agentnet-device-core = { path = "../device-core" }
myagents-agentnet-identity-core = { path = "../identity-core" }
nix = { version = "=0.30.1", features = ["user"] }
p256 = { version = "=0.13.2", features = ["ecdsa", "pkcs8"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem", "x509-parser"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
uuid = { version = "=1.18.1", features = ["v4"] }
url = "=2.5.7"
x509-parser = "=0.18.1"

[dev-dependencies]
myagents-agent-network-crypto = { path = "../../../src-tauri/agent-network-crypto" }
tempfile = "=3.23.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
