[package]
name = "myagents-agentnet-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
base64 = "=0.22.1"
axum = { version = "=0.8.8", features = ["json", "query"] }
openidconnect = "=4.0.1"
libc = "=0.2.190"
myagents-agentnet-device-core = { path = "device-core" }
myagents-agentnet-identity-core = { path = "identity-core" }
myagents-agentnet-admission-core = { path = "admission-core" }
myagents-agentnet-metadata-core = { path = "metadata-core" }
nix = { version = "=0.30.1", features = ["user"] }
rand = "=0.9.2"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
subtle = "=2.6.1"
thiserror = "=2.0.17"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
url = "=2.5.7"
uuid = { version = "=1.18.1", features = ["v4"] }
zeroize = { version = "=1.8.2", features = ["serde"] }

[dev-dependencies]
http-body = "=1.1.0"
myagents-agent-network-crypto = { path = "../../src-tauri/agent-network-crypto" }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
rsa = "=0.9.10"
tempfile = "=3.23.0"
tower = { version = "=0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
