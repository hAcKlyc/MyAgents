[package]
name = "myagents-agentnet-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
base64 = "=0.22.1"
openidconnect = "=4.0.1"
libc = "=0.2.190"
nix = { version = "=0.30.1", features = ["user"] }
rand = "=0.9.2"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
subtle = "=2.6.1"
thiserror = "=2.0.17"
url = "=2.5.7"
uuid = { version = "=1.18.1", features = ["v4"] }
zeroize = "=1.8.2"

[dev-dependencies]
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
rsa = "=0.9.10"
tempfile = "=3.23.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
