[package]
name = "myagents-agentnet-device-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "AGPL-3.0-only"

[dependencies]
base64 = "=0.22.1"
libc = "=0.2.190"
myagents-agent-network-protocol = { path = "../../../src-tauri/agent-network-protocol" }
nix = { version = "=0.30.1", features = ["user"] }
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "=0.9.2"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem", "x509-parser"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
zeroize = "=1.8.2"
uuid = { version = "=1.18.1", features = ["v4"] }

[dev-dependencies]
myagents-agent-network-crypto = { path = "../../../src-tauri/agent-network-crypto" }
tempfile = "=3.23.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
