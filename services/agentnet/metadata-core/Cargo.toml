[package]
name = "myagents-agentnet-metadata-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "AGPL-3.0-only"

[dependencies]
base64 = "=0.22.1"
libc = "=0.2.190"
myagents-agent-network-protocol = { path = "../../../src-tauri/agent-network-protocol" }
myagents-agentnet-device-core = { path = "../device-core" }
nix = { version = "=0.30.1", features = ["user"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
time = { version = "=0.3.55", features = ["formatting", "macros"] }
uuid = { version = "=1.18.1", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.23.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
