{{ template "header.html" . }}

<div class="theme-panel">
  <h1 class="theme-heading">登录云后台</h1><p class="description">使用已有 MoXBots 账号登录。</p>
  <form method="post" action="{{ .PostURL }}">
    <div class="theme-form-row">
      <div class="theme-form-label">
        <label for="login">账号或邮箱</label>
      </div>
	  <input tabindex="1" required id="login" name="login" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" class="theme-form-input" placeholder="请输入账号或邮箱" {{ if .Username }} value="{{ .Username }}" {{ else }} autofocus {{ end }}/>
    </div>
    <div class="theme-form-row">
      <div class="theme-form-label">
        <label for="password">密码</label>
      </div>
	  <input tabindex="2" required id="password" name="password" type="password" class="theme-form-input" placeholder="请输入密码" autocomplete="current-password" {{ if .Invalid }} autofocus {{ end }}/>
    </div>

    {{ if .Invalid }}
      <div id="login-error" class="dex-error-box">
        账号或密码不正确，请重新输入。
      </div>
    {{ end }}

    {{ if .ShowRememberMe }}
    <div class="theme-form-row">
      <label class="theme-remember-me">
        <input tabindex="3" type="checkbox" name="remember_me" {{ if .RememberMeChecked }}checked{{ end }}/>
        记住登录状态
      </label>
    </div>
    {{ end }}

    <button tabindex="4" id="submit-login" type="submit" class="dex-btn theme-btn--primary">登录</button>

  </form><a class="cancel-link" href="/admin">返回后台</a>
  {{ if .BackLink }}
  <div class="theme-link-back">
    <a class="dex-subtle-text" href="{{ .BackLink }}">选择其他登录方式。</a>
  </div>
  {{ end }}
</div>


<script type="text/javascript">
  document.querySelector('form').onsubmit = function(e) {
    var el = document.querySelector('#submit-login');
    el.setAttribute('disabled', 'disabled');
  };
</script>

{{ template "footer.html" . }}
