<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoXBots · 云服务后台</title><link rel="stylesheet" href="/admin/styles.css"><script src="/admin/app.js" defer></script></head>
<body>
<div id="login" class="login"><section class="login-card"><div class="brand-mark">M</div><p class="eyebrow">MOXBOTS CLOUD</p><h1>云服务管理后台</h1><p>登录 MoXBots 云后台，管理 Bots、用户和 Hosts。</p><button id="login-button" class="primary" type="button">使用账号登录</button><p id="login-status" role="status"></p><button id="cancel-login" class="cancel-login" type="button" hidden>取消登录</button></section></div>
<div id="console" class="shell" hidden>
<aside><a class="brand" href="/admin">MoXBots <span>CLOUD</span></a><p class="nav-label">管理平台</p><nav aria-label="后台导航"><button data-page="bots" class="active" type="button">Bots 管理</button><button data-page="users" type="button">用户</button><button data-page="hosts" type="button">Hosts</button><button data-page="audit" type="button">操作审计</button></nav><div class="sidebar-note">Host Product Session<br><strong>Bots</strong><small>模型调用与共享未开放</small></div></aside>
<main><header><div><p class="eyebrow">平台管理员 · 本实例</p><h1 id="page-title">Bots 管理</h1></div><div class="header-actions"><button id="refresh" type="button">刷新</button><button id="logout" type="button">退出</button></div></header><p id="account" class="account"></p><div id="notice" role="status" hidden></div><section id="pending" class="notice warning" hidden><strong>操作结果尚未确认</strong><p id="pending-help">保持原操作编号，查询回执或按原请求重试。</p><code id="pending-id"></code><div class="actions"><button id="check-receipt" type="button">查询原操作</button><button id="retry-operation" type="button">重试原请求</button></div></section>
<div id="content"></div><footer>首阶段只管理 Host Product Session。Host Session 已启动不表示模型调用已开放；付费推理、共享、IM 与定时任务尚未接入。云端登记与 Host 快照分开显示。</footer></main>
</div>
<dialog id="editor"><form id="edit-form"><div class="dialog-head"><div><p class="eyebrow">BOTS 管理</p><h2 id="edit-title">新建 Bot</h2></div><button id="close-editor" aria-label="关闭" type="button">×</button></div><p id="edit-description" class="muted"></p><div id="fields"></div><p id="form-error" class="error" role="alert"></p><div class="dialog-actions"><button id="cancel-editor" type="button">取消</button><button id="save-editor" class="primary" type="submit">保存</button></div></form></dialog>
</body></html>
