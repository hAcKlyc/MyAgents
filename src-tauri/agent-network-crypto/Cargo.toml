[package]
name = "myagents-agent-network-crypto"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "AGPL-3.0-only"

[features]
default = []
os-store = ["dep:keyring", "dep:security-framework", "dep:security-framework-sys", "dep:core-foundation"]
# Real crypto fixtures used by existing Desktop channel parity tests only.
test-support = []
fixed-macos-reader = ["os-store"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
ring = "0.17"
libc = "0.2.180"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2"
rustls-platform-verifier = "=0.6.2"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
myagents-agent-network-protocol = { path = "../agent-network-protocol" }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", optional = true, default-features = false, features = ["apple-native"] }
security-framework = { version = "=3.7.0", optional = true }
security-framework-sys = { version = "=2.17.0", optional = true }
core-foundation = { version = "=0.10.1", optional = true }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", optional = true, default-features = false, features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", optional = true, default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "moxbots-credential-reader"
path = "src/bin/moxbots-credential-reader.rs"
required-features = ["os-store", "fixed-macos-reader"]
