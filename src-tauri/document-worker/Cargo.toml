[package]
name = "myagents-document-worker"
version = "0.4.15"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anydoc = { path = "../vendor/anydoc" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
log = "0.4"
office-crypto = { path = "../vendor/office-crypto" }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-28"] }
pdf-inspector = "=1.14.2"
pdfium-render = { version = "=0.9.3", default-features = false, features = ["pdfium_latest", "image_025", "thread_safe"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
