# Include inside the EXISTING HTTPS server for 140.143.183.232.
# The existing website locations, certificate, listener and upstream remain owned by that server.
# On disk: /srv/moxbots/updates/{stable,releases}; adjust root only after confirming deployment layout.
location = /updates/stable/darwin-aarch64.json {
    root /srv/moxbots;
    default_type application/json;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =204;
}

# No formal release has been validated for another target. Do not invent a platform manifest.
location ^~ /updates/stable/ {
    add_header Cache-Control no-store always;
    return 204;
}

location ~ "^/updates/releases/(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)/[a-f0-9]{64}-MoXBots\.app\.tar\.gz$" {
    root /srv/moxbots;
    default_type application/gzip;
    gzip off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

# Receipts, staging files, publisher locks and recovery history are deliberately not public.
location /updates/ {
    return 404;
}
